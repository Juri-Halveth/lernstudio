 { tag:'Wie die Blase rechnet', mood:{glow:'#1c1630', glyph:'◯', chord:[92,138,185]},
   frage:'Eine Seifenblase wird ohne Nachdenken sofort perfekt rund.  Wie findet sie die richtige Form so schnell?',
   wahl:[{text:'Sie probiert blitzschnell viele Formen aus.',tief:false},{text:'Luftdruck drückt sie einfach zufällig rund.',tief:false},{text:'Sie rutscht von selbst in die Form mit der kleinsten Haut, und das ist die Kugel.',tief:true}],
   antwort_flach:'Von Probieren würde man Zögern sehen, doch die Blase zögert nie. Sie fällt sofort ins Richtige.',
   antwort_tief:'Genau. Kein Suchen, ein Fallen, hinab zur sparsamsten Form.',
   enthuellung:`Die Haut der Blase zieht sich zusammen, bis sie so klein wie möglich ist, und für ein gegebenes Luftvolumen ist die Kugel die Form mit der kleinsten Oberfläche. Was Mathematiker als schweres Minimalproblem rechnen, löst die Seifenhaut in einem Wimpernschlag, einfach indem sie nachgibt. Eine Schicht unter dem schillernden Häutchen liegt ein Naturgesetz, das immer das Sparsamste findet.`,
   aha:'Die Natur sucht das Minimum nicht, sie fällt hinein.' },

 { tag:'Warum die Wabe sechseckig ist', mood:{glow:'#1e2410', glyph:'⬡', chord:[87,131,174]},
   frage:'Bienen bauen ihre Waben aus lauter Sechsecken, nie aus Fünfecken oder Kreisen.  Woher kommt die Form?',
   wahl:[{text:'Bienen lernen es von anderen Bienen.',tief:false},{text:'Das Sechseck ist die sparsamste Form, die eine Fläche lückenlos füllt.',tief:true},{text:'Zufall, es hätte auch anders sein können.',tief:false}],
   antwort_flach:'Sie geben es weiter, ja, doch warum gerade diese Form? Die Antwort liegt nicht bei den Bienen, sondern in der Fläche selbst.',
   antwort_tief:'Genau. Die Biene wählt nicht, die Form ist die einzig sparsame, die passt.',
   enthuellung:`Ein Kreis lässt Lücken, ein Fünfeck kachelt nicht auf. Nur Dreieck, Viereck und Sechseck füllen eine Fläche ganz, und von diesen braucht das Sechseck für dieselbe Fläche die kürzesten Wände, also am wenigsten Wachs. Der Mathematiker Thomas Hales hat das erst 1999 streng bewiesen, doch die Bienen bauen es seit Jahrmillionen. Eine Schicht unter dem Instinkt liegt ein gelöstes Sparproblem.`,
   aha:'Manche Formen sind keine Wahl, sondern die einzige, die die Zahl erlaubt.' },

 { tag:'Die Zahl in der Blüte', mood:{glow:'#2b2008', glyph:'φ', chord:[110,165,220]},
   frage:'In einer Sonnenblume sitzen die Kerne in zwei Spiralen, immer im selben goldenen Winkel.  Rechnet die Blume?',
   wahl:[{text:'Ja, irgendwie muss sie die Zahl kennen.',tief:false},{text:'Nein, sie folgt einer einfachen Wachstumsregel, die genau auf dieser Zahl landet.',tief:true},{text:'Zufall, es sieht nur schön geordnet aus.',tief:false}],
   antwort_flach:'Ein schöner Gedanke, doch die Blume weiß nichts. Und trotzdem trifft sie die Zahl jedes Mal.',
   antwort_tief:'Genau. Kein Wissen, nur eine Regel, und die Regel trägt die Zahl in sich.',
   enthuellung:`Jeder neue Kern setzt sich um denselben Winkel gedreht neben den letzten, rund 137,5 Grad, den goldenen Winkel. Aus dieser einen schlichten Regel wächst die dichteste Packung, die es gibt, kein Platz wird verschwendet. Die Blume hat den goldenen Schnitt nicht erfunden, sie ist auf ihn gestoßen, eine Schicht tiefer, dort wo Wachsen und Zahl dasselbe sind.`,
   aha:'Die Natur muss nicht rechnen, um das Richtige zu treffen.' },

 { tag:'Musik ist verborgene Zahl', mood:{glow:'#221030', glyph:'♪', chord:[130,196,262]},
   frage:'Zwei Töne klingen zusammen einfach rein, ein anderes Paar klingt schräg.  Was entscheidet das?',
   wahl:[{text:'Der Geschmack, manche mögen es eben so.',tief:false},{text:'Gewohnheit, wir sind mit diesen Tönen aufgewachsen.',tief:false},{text:'Ein einfaches Zahlenverhältnis der Schwingungen, zwei zu eins, drei zu zwei.',tief:true}],
   antwort_flach:'Geschmack spielt mit, doch unter dem Gefühl liegt etwas Festeres, ein Verhältnis, das schon stimmte, bevor du es hörtest.',
   antwort_tief:'Ja. Was dein Ohr rein nennt, ist in Wahrheit eine schlichte Zahl.',
   enthuellung:`Pythagoras teilte eine gespannte Saite und hörte, dass die halbe Länge dieselbe Note eine Oktave höher gibt, das Verhältnis zwei zu eins. Drei zu zwei ergibt die Quinte, den Klang, den wir stimmig nennen. Die Harmonie, die dir warm wird im Bauch, ist eine Schicht tiefer reine Arithmetik, Zahl, die zu Klang geworden ist.`,
   aha:'Was rein klingt, ist ein einfaches Verhältnis, das du hörst, ohne es zu zählen.' },

 { tag:'Die eine Form hinter vielem', mood:{glow:'#08202c', glyph:'∿', chord:[96,144,192]},
   frage:'Wasser, Schall, Licht, eine schwingende Saite.  Alle wogen in derselben sanften Wellenform.  Zufall?',
   wahl:[{text:'Ja, Wellen sehen halt oft ähnlich aus.',tief:false},{text:'Nein, überall wirkt dieselbe Regel, jede Auslenkung zieht gleich stark zurück.',tief:true},{text:'Weil unser Auge alles zu Wellen glättet.',tief:false}],
   antwort_flach:'Ähnlich, ja, doch es ist nicht nur ähnlich, es ist genau dieselbe Kurve, immer wieder.',
   antwort_tief:'Ja. Eine Regel, und aus ihr wächst überall dieselbe schwingende Linie.',
   enthuellung:`Wo etwas umso stärker zurückgezogen wird, je weiter es ausgelenkt ist, entsteht immer dieselbe Bewegung, die Sinuswelle. Das Pendel, die Gitarrensaite, das Licht und der Ton gehorchen alle diesem einen Satz. Eine Schicht unter den vielen Wellen der Welt liegt eine einzige Form, geboren aus einer einzigen Regel.`,
   aha:'Viele verschiedene Wellen, eine einzige verborgene Form.' },

 { tag:'Dass die Welt lesbar ist', mood:{glow:'#14162e', glyph:'✧', chord:[98,147,196]},
   frage:'Die Welt könnte reines Chaos sein, wildes Rauschen ohne Regel.  Warum lässt sie sich stattdessen berechnen?',
   wahl:[{text:'Weil wir Menschen einfach gut im Ordnen sind.',tief:false},{text:'Zufall, ein bisschen Ordnung findet sich überall.',tief:false},{text:'Das weiß niemand sicher, und genau das ist das Wunder, dass es überhaupt so ist.',tief:true},{text:'Weil die Naturgesetze es uns leicht machen wollen.',tief:false}],
   antwort_flach:'Ja, unser Ordnungssinn ist stark, doch schau, die Ordnung war schon in den Dingen, bevor wir hinsahen.',
   antwort_tief:'Ja. Du hältst das Staunen aus, statt es zuzukleistern.',
   enthuellung:`Die Welt ist wirklich berechenbar, und man kann es sehen: Astronomen sagen eine Sonnenfinsternis auf die Minute genau voraus, Jahrhunderte im Voraus, weil dieselben schlichten Gleichungen für Sonne, Erde und Mond immer wieder aufgehen. Einstein sagte, das Unbegreiflichste am Universum sei, dass es begreiflich ist. Es gab keinen Grund, dass Sterne, Atome und Jahreszeiten sich in Gleichungen fassen lassen, und doch tun sie es. Eine Schicht unter dem bunten Durcheinander liegt eine stille Ordnung, und dass wir sie lesen dürfen, ist kein Fakt zum Abhaken, sondern ein Wunder zum Anschauen.`,
   aha:'Dass die Welt überhaupt Ordnung hat, ist das erste Wunder, nicht das letzte.' },

 { tag:'Der Moment des Klick', mood:{glow:'#101f1a', glyph:'◯', chord:[104,156,208]},
   frage:'Ein Problem quält dich stundenlang, dann kippt plötzlich etwas und alles wird einfach.  Was ist da geschehen?',
   wahl:[{text:'Ich habe mich endlich genug angestrengt.',tief:false},{text:'Ich habe die Schicht gefunden, von der aus es leicht ist.',tief:true},{text:'Ich hatte in dem Moment einfach Glück.',tief:false},{text:'Mein Gehirn war endlich ausgeruht.',tief:false}],
   antwort_flach:'Mühe gehört dazu, ohne die Stunden davor kommt der Moment nicht.',
   antwort_tief:'Ja, das Schwere lag nie im Problem, nur im falschen Blickwinkel.',
   enthuellung:`Der junge Gauß sollte in der Schule alle Zahlen von 1 bis 100 addieren, eine mühsame Kette. Statt stur zu rechnen, sah er die Zahlen anders, ganz vorn und ganz hinten zu Paaren gelegt, 1 und 100, 2 und 99, immer 101, fünfzig solche Paare, macht 5050. Dieselbe Aufgabe, ein einziger Blick, und die Mühe war weg. Oft ist ein Problem schwer, weil du es von der falschen Seite ansiehst, und schön wird es in dem Augenblick, wo du den Ort findest, von dem aus es leicht ist. Mathematiker nennen das die richtige Sichtweise, und sie fühlt sich an wie ein Fenster, das aufgeht. Eine Schicht tiefer war die Einfachheit immer schon da, du musstest nur den Winkel wechseln.`,
   aha:'Das Schwere sitzt selten im Ding, meist im Blickwinkel.' },

 { tag:'Kein Platz für Hässliches', mood:{glow:'#1a1230', glyph:'△', chord:[98,147,196]},
   frage:'Zwei Beweise, beide richtig.  Einer kurz und klar, einer lang und mühsam.  Warum nennst du nur den einen schön?',
   wahl:[{text:'Weil kurz einfach angenehmer zu lesen ist.',tief:false},{text:'Weil der klare zeigt, WARUM es wahr ist, nicht nur DASS.',tief:true},{text:'Weil der kürzere weniger Arbeit macht.',tief:false},{text:'Weil Länge auf Dauer ermüdet.',tief:false}],
   antwort_flach:'Ja, das Kurze atmet leichter, und schon das ist ein echtes Gefühl.',
   antwort_tief:'Genau, Schönheit ist hier kein Schmuck, sondern Einsicht, die sich zeigt.',
   enthuellung:`Nimm Euklids Beweis, dass es unendlich viele Primzahlen gibt: Multipliziere alle bekannten miteinander und addiere eins, und schon muss es eine weitere geben, die in der Liste fehlt. Ein paar Zeilen, und du siehst, warum es gar nicht anders sein kann. Ein langer, mühsamer Beweis kann dieselbe Wahrheit sichern, ohne dass du je begreifst, warum sie gilt. Der Mathematiker G. H. Hardy schrieb, es gebe keinen dauerhaften Platz auf der Welt für hässliche Mathematik. Ein schöner Beweis versteckt nichts, er lässt dich sehen, warum die Sache wahr sein muss. Eine Schicht tiefer meint schön nicht hübsch, sondern durchsichtig bis auf den Grund.`,
   aha:'Schön heißt, du siehst nicht nur dass es stimmt, sondern warum.' },

 { tag:'Der Schauer bei der Gleichung', mood:{glow:'#241033', glyph:'✧', chord:[110,165,220]},
   frage:'Eine Formel steht plötzlich ganz einfach da, und dir läuft ein Schauer über den Rücken.  Was berührt dich da?',
   wahl:[{text:'Dass ich sie endlich verstanden habe.',tief:false},{text:'Dass so viel in so wenig passt, als hätte die Welt zugestimmt.',tief:true},{text:'Dass ich offenbar gut in Mathe bin.',tief:false},{text:'Dass die Prüfung jetzt leichter wird.',tief:false}],
   antwort_flach:'Verstehen ist ein warmes Glück, das darfst du ruhig fühlen.',
   antwort_tief:'Ja, dieser Schauer ist das Erkennen einer Ordnung, die größer ist als du.',
   enthuellung:`Der Hirnforscher Semir Zeki maß, dass eine als schön empfundene Gleichung dieselbe Region weckt wie große Musik oder ein Gemälde. Der Schauer ist kein Zufall, er ist dein alter Sinn für Ordnung, der etwas Stimmiges erkennt. Unter dem Rechnen liegt eine Schicht, in der Wahrheit sich wie Schönheit anfühlt.`,
   aha:'Der Schauer ist dein ältester Sinn für Ordnung, der leise Ja sagt.' },

 { tag:'Wenn Schönheit sich irren kann', mood:{glow:'#0e1a2b', glyph:'φ', chord:[87,130,174]},
   frage:'Ein Physiker sagt, eine Gleichung sei zu schön, um falsch zu sein.  Darf man das glauben?',
   wahl:[{text:'Ja, was schön ist, ist am Ende immer wahr.',tief:false},{text:'Nein, schön und wahr haben nichts miteinander zu tun.',tief:false},{text:'Schönheit ist ein guter Wegweiser, aber sie kann auch verführen.',tief:true}],
   antwort_flach:'Der Wunsch ist verständlich, das Schöne zieht uns wie ein Licht.',
   antwort_tief:'Ja, sie zeigt oft den Weg, doch geprüft wird am Ende an der Welt.',
   enthuellung:`Paul Dirac fand Gleichungen, deren Schönheit ihn zu echten Teilchen führte, zum Zwilling des Elektrons aus Antimaterie. Er hielt Schönheit für wichtiger als die Messung und lag damit oft, aber nicht immer richtig. Eine Schicht tiefer ist Eleganz eine Ahnung von Ordnung, ein Kompass, kein Beweis, und das macht sie umso menschlicher.`,
   aha:'Schönheit weist die Richtung, die Wirklichkeit spricht das letzte Wort.' },

 { tag:'Das Buch der Beweise', mood:{glow:'#2a1810', glyph:'⟡', chord:[82,123,165]},
   frage:'Ein Mathematiker träumt von einem Buch, in dem für jeden Satz der schönste Beweis steht.  Wer soll es geschrieben haben?',
   wahl:[{text:'Ein sehr kluger Mensch, irgendwann einmal.',tief:false},{text:'Niemand, die schönsten Beweise sind schon da und werden gefunden.',tief:true},{text:'Ein Computer, der geduldig alles durchrechnet.',tief:false},{text:'Ein berühmter Professor von früher.',tief:false}],
   antwort_flach:'Kluge Köpfe haben viel gefunden, und das ist schon ein Wunder für sich.',
   antwort_tief:'Genau, gefunden, nicht erdacht, als hätte der Beweis auf dich gewartet.',
   enthuellung:`Paul Erdős sprach vom Buch, in dem Gott die vollkommenen Beweise aufbewahrt, und ein Mathematiker müsse sie nur erblicken. Zwei Mathematiker, Martin Aigner und Günter Ziegler, nahmen ihn beim Wort und veröffentlichten 1998 wirklich ein Buch mit dem Titel Proofs from THE BOOK, eine Sammlung besonders schöner Beweise. Es ist ein Scherz und doch ernst, denn ein wirklich schöner Beweis fühlt sich nicht erfunden an, sondern entdeckt. Unter der Arbeit liegt die Ahnung einer Schicht, in der die beste Form schon fertig wartet.`,
   aha:'Den schönsten Beweis erfindest du nicht, du erblickst ihn.' },

 { tag:'Vor dem ersten Zähler', mood:{glow:'#1a1230', glyph:'∎', chord:[96,128,160]},
   frage:'Stell dir vor, es gibt niemanden auf der Welt.  Sind zwei Steine und zwei Steine dann immer noch vier?',
   wahl:[{text:'Nein, ohne jemanden, der zählt, gibt es keine Zahl.',tief:false},{text:'Ja, das Zählen fehlt, aber vier waren es trotzdem schon.',tief:true},{text:'Das kann man nicht wissen, ohne nachzusehen.',tief:false}],
   antwort_flach:'Ein schöner Gedanke, das Zählen fühlt sich wirklich wie unsere ganz eigene Tat an.',
   antwort_tief:'Ja, wir haben das Zählen erfunden, aber nicht das, was dabei herauskommt.',
   enthuellung:`Das Zählen ist eine Handlung von uns, die Zahl darunter ist es nicht. Zwei und zwei ergaben vier, lange bevor ein Mund das Wort vier formte. Kronecker sagte, die ganzen Zahlen habe der liebe Gott gemacht, alles andere sei Menschenwerk. Eine Schicht unter dem Zählen liegt etwas, das wir nur gefunden und nie gemacht haben.`,
   aha:'Zählen ist unsere Tat, die Zahl darunter war immer schon da.' },

 { tag:'Die Wahrheit, die keiner wollte', mood:{glow:'#2a141a', glyph:'√', chord:[82,110,146]},
   frage:'Die Pythagoreer glaubten, alles sei ein Verhältnis ganzer Zahlen.  Dann fanden sie eine Zahl, die diesen Glauben zerbrach.  Was sagt das?',
   wahl:[{text:'Sie haben sich verrechnet, ihr Glaube stimmte eigentlich.',tief:false},{text:'Sie stießen auf etwas Wahres, das stärker war als ihr Wunsch.',tief:true},{text:'Sie hätten die neue Zahl einfach verbieten sollen.',tief:false}],
   antwort_flach:'Man versteht den Wunsch, an der schönen alten Ordnung festzuhalten.',
   antwort_tief:'Ja, die Wahrheit fragte nicht, was sie hofften, sie war einfach da.',
   enthuellung:`Die Länge der Diagonale eines Quadrats, die Wurzel aus zwei, lässt sich durch keinen Bruch ganzer Zahlen ausdrücken. Die Pythagoreer sollen entsetzt gewesen sein, die Legende sagt, einer bezahlte die Entdeckung mit dem Leben. Man erfindet keine Wahrheit, die den eigenen Glauben zertrümmert, man entdeckt sie. Gerade darin, dass sie gegen ihren Willen galt, zeigt sich die Schicht darunter, die niemandem gehört.`,
   aha:'Was du nicht wolltest und was doch wahr ist, hast du nicht erfunden.' },

 { tag:'Die Ziffern warten schon', mood:{glow:'#0d2426', glyph:'π', chord:[88,132,176]},
   frage:'Die millionste Stelle von Pi.  Legen wir sie fest, wenn wir sie ausrechnen, oder holen wir sie nur ab?',
   wahl:[{text:'Wir legen sie fest, der Computer erzeugt sie.',tief:false},{text:'Sie entsteht erst im Moment der Rechnung.',tief:false},{text:'Wir holen sie ab, sie stand schon fest, bevor wir hinsahen.',tief:true}],
   antwort_flach:'Verständlich, es fühlt sich an, als würde die Maschine die Ziffer in dem Moment erschaffen.',
   antwort_tief:'Genau, die Rechnung ist nur das Fernrohr, die Ziffer war längst da.',
   enthuellung:`Pi ist kein offener Vorschlag, den wir noch verhandeln. In dem Augenblick, in dem ein Kreis denkbar ist, steht jede seiner Ziffern schon unverrückbar fest, bis in die milliardste Stelle, die noch niemand berechnet hat. Wir erfinden sie nicht, wir graben sie aus wie ein Fossil, das immer schon im Stein lag. Eine Schicht tiefer ist Pi kein Werk, sondern ein Fund.`,
   aha:'Wir rechnen Pi nicht aus, wir graben es aus.' },

 { tag:'In jeder denkbaren Welt', mood:{glow:'#111a24', glyph:'✧', chord:[87,116,174]},
   frage:'Fremde Wesen an einem fernen Stern, mit ganz anderen Sinnen.  Was hättest du mit ihnen ganz sicher gemeinsam?',
   wahl:[{text:'Wahrscheinlich fast nichts, alles wäre uns völlig fremd.',tief:false},{text:'Vielleicht die Freude an Farben oder Musik.',tief:false},{text:'Dass eine Primzahl bei ihnen dieselbe ist wie bei uns.',tief:true}],
   antwort_flach:'Ein weiter, demütiger Gedanke, so fremd könnte das Leben da draußen wirklich sein.',
   antwort_tief:'Ja, ihre Sprache wäre fremd, ihre Zahlen dieselben.',
   enthuellung:`Sprachen, Farben, Sitten, all das könnte grundverschieden sein. Aber dass sieben sich nur durch eins und durch sich selbst teilen lässt, gilt an jedem Stern, in jeder denkbaren Welt. Darum tragen manche Botschaften ins All bewusst Primzahlen, als einzige Sprache, die überall dieselbe ist. Unter aller Verschiedenheit liegt eine Schicht, die keine Kultur erfindet, weil jede sie nur finden kann.`,
   aha:'Was in jeder denkbaren Welt gilt, hat keine Kultur gemacht.' },

 { tag:'Das Nichts, das zählt', mood:{glow:'#1a1230', glyph:'∅', chord:[87,130,174]},
   frage:'Die Null sagt, dass nichts da ist.  Warum braucht das Nichts überhaupt ein eigenes Zeichen?',
   wahl:[{text:'Damit die Zahlenreihe hübsch vollständig aussieht.',tief:false},{text:'Weil das Nichts selbst ein Gedanke ist, ein voller Platz, den man erst denken muss.',tief:true},{text:'Aus Gewohnheit, andere Zahlen haben ja auch Zeichen.',tief:false}],
   antwort_flach:'Verständlich gedacht, doch unter der Ordnung liegt noch etwas Größeres.',
   antwort_tief:'Ja, die Null ist kein Fehlen, sondern das Fehlen, das jemand zu einem Ding gemacht hat.',
   enthuellung:`Lange kam die Menschheit ohne Null aus, sie wurde erst spät klar gedacht, in Indien bei Brahmagupta. Das Schwere daran ist, das Nichts als etwas zu fassen, als eine Stelle, die leer ist und trotzdem zählt. Eine Schicht unter allen Zahlen liegt dieser mutige Gedanke, dem Leeren einen Namen zu geben.`,
   aha:'Die Null ist das Nichts, das man erst denken musste, um es zählen zu können.' },

 { tag:'Der Kreis, den es nicht gibt', mood:{glow:'#16324f', glyph:'◯', chord:[98,147,196]},
   frage:'Du zeichnest den saubersten Kreis, den du kannst.  Ist er ein echter, vollkommener Kreis?',
   wahl:[{text:'Ja, wenn ich sorgfältig genug bin.',tief:false},{text:'Fast, nur der Stift ist ein wenig zu grob.',tief:false},{text:'Nein, der vollkommene Kreis wohnt nur im Gedanken, jeder gezeichnete ist nur sein Schatten.',tief:true}],
   antwort_flach:'Schön, dass du es genau nimmst, deine Hand kommt der Idee ganz nah.',
   antwort_tief:'Ja, und das Staunen ist, dass du den perfekten Kreis kennst, obwohl du ihn nie gesehen hast.',
   enthuellung:`Platon nannte das die Welt der Ideen. Kein Kreis aus Tinte oder Metall ist je vollkommen rund, unter dem Mikroskop zeigt jeder seine Beulen. Und doch trägt jeder von uns den einen, reinen Kreis im Kopf, an dem wir alle anderen messen. Er ist die Schicht darunter, die Form selbst, die keiner erfunden hat.`,
   aha:'Den vollkommenen Kreis gibt es nirgends, und trotzdem kennst du ihn genau.' },

 { tag:'Der Punkt ohne Größe', mood:{glow:'#1f2733', glyph:'·', chord:[92,138,184]},
   frage:'In der Geometrie hat ein Punkt keine Größe, keine Breite, gar keine Ausdehnung.  Wo findest du so einen Punkt in der Welt?',
   wahl:[{text:'Auf dem Papier, dort wo ich ihn hinmale.',tief:false},{text:'Ganz winzig, unter einem starken Mikroskop.',tief:false},{text:'Nirgends in der Welt, er lebt nur als reine Idee, und trotzdem ruht alle Geometrie auf ihm.',tief:true}],
   antwort_flach:'Dein Punkt ist sichtbar und echt, doch der gemeinte Punkt ist noch feiner als jede Spitze.',
   antwort_tief:'Ja, etwas, das es nirgends gibt, hält die ganze Geometrie zusammen.',
   enthuellung:`Euklid schrieb, ein Punkt sei das, was keine Teile hat. Kein Tintenfleck, kein Sandkorn ist wirklich ohne Größe, jedes ließe sich noch teilen. Trotzdem beginnt jede Linie, jeder Kreis, jedes Bauwerk der Mathematik bei diesem Punkt, den es in der Welt gar nicht gibt. Eine Schicht unter dem Gezeichneten liegt das reine, größenlose Ideal.`,
   aha:'Den Punkt ohne Größe gibt es nirgends, und doch trägt er die ganze Geometrie.' },

 { tag:'Die Zahl ohne Ende', mood:{glow:'#123f3a', glyph:'π', chord:[110,165,220]},
   frage:'Von Pi kennt man schon Billionen Nachkommastellen, und niemand findet ein Ende.  Warum hört es nie auf?',
   wahl:[{text:'Die Rechner sind noch nicht schnell genug.',tief:false},{text:'Irgendwann wird sich die Ziffernfolge sicher wiederholen.',tief:false},{text:'Weil Pi kein Ergebnis ist, das aufgeht, sondern ein zeitloses Verhältnis, das in jedem Kreis schon steckt.',tief:true},{text:'Weil wir Kreise noch nicht genau genug messen.',tief:false}],
   antwort_flach:'Eine kluge Vermutung, und doch führt die Spur noch eine Schicht tiefer.',
   antwort_tief:'Genau, du rechnest Pi nicht aus, du entdeckst nur immer mehr von etwas, das längst fertig war.',
   enthuellung:`Pi ist das Verhältnis von Umfang zu Durchmesser, bei jedem Kreis dasselbe, ob Murmel oder Mond. Es ist irrational, die Ziffern wiederholen sich nie, und sie waren schon so, bevor der erste Mensch einen Kreis in den Sand zog. Wir haben Pi nicht gemacht, wir haben es gefunden, eine Wahrheit, die eine Schicht tiefer liegt als jedes runde Ding.`,
   aha:'Pi hat niemand erfunden, es lag im Kreis, lange bevor jemand es dachte.' },

 { tag:'Unendlich ist kein sehr groß', mood:{glow:'#2a1440', glyph:'∞', chord:[82,123,164]},
   frage:'Ein Hotel hat unendlich viele Zimmer, alle belegt.  Ein neuer Gast kommt.  Ist noch Platz?',
   wahl:[{text:'Nein, voll ist voll.',tief:false},{text:'Nur wenn vorher jemand auszieht.',tief:false},{text:'Ja, jeder rückt ein Zimmer weiter, dann wird das erste frei, und alle haben trotzdem eins.',tief:true}],
   antwort_flach:'So denkt der Alltag, und genau da beginnt das Wunder, eine Schicht tiefer.',
   antwort_tief:'Ja, beim Unendlichen ist das Ganze nicht größer als ein Teil, das bricht jede gewohnte Regel.',
   enthuellung:`David Hilbert erfand dieses Hotel als Bild. Es zeigt, dass unendlich keine besonders große Zahl ist, sondern eine andere Art von Ding. Ein Ding, bei dem du Gäste hinzufügen kannst, ohne dass es voller wird. Eine Schicht unter dem Wort viel liegt hier etwas ganz anderes, eine Größe, die sich nicht wie eine Größe verhält.`,
   aha:'Unendlich ist keine riesige Zahl, sondern eine andere Art von Ding.' },

 { tag:'Das gedrittelte Ganze', mood:{glow:'#1f2a1a', glyph:'⅓', chord:[82,123,165]},
   frage:'Ein Drittel schreibt man als 0,333... mit endlos vielen Dreien.  Was ergibt das mal drei?',
   wahl:[{text:'0,999..., also ein bisschen weniger als eins.',tief:false},{text:'Genau eins, denn drei Drittel sind ein Ganzes.',tief:true},{text:'0,999..., und das ist etwas ganz anderes als eins.',tief:false}],
   antwort_flach:'Die vielen Neunen legen ein winziges Fehlen nahe.  Schau tiefer, was ist drei mal ein Drittel, ganz ohne Kommastellen gedacht?',
   antwort_tief:'Ja.  Drei Drittel sind ein Ganzes, und die Schreibweise 0,999... ist nur ein anderer Name dafür.',
   enthuellung:`Ein Drittel ist unbestreitbar 0,333... und drei Drittel sind ein Ganzes.  Dieselbe Rechnung, Ziffer für Ziffer, ergibt 0,999....  Also sind 0,999... und 1 dieselbe Zahl, nur zwei Schreibweisen.  Es gibt Zahlen mit zwei gültigen Dezimaldarstellungen, das ist seit der Analysis des 19. Jahrhunderts sauber verstanden.  Die Neunen täuschen ein Fehlen vor, das es gar nicht gibt.`,
   aha:'Manche Zahlen haben zwei Namen, und keiner ist der kleinere.' },

 { tag:'Das letzte Bisschen', mood:{glow:'#1a2740', glyph:'≡', chord:[98,147,196]},
   frage:'0,9 dann 0,99 dann 0,999, immer weiter, unendlich viele Neunen.  Ist diese Zahl kleiner als 1 oder gleich 1?',
   wahl:[{text:'Kleiner, es fehlt ja immer ein winziges Bisschen.',tief:false},{text:'Gleich, denn zwischen beiden ist kein Platz mehr für eine dritte Zahl.',tief:true},{text:'Das kann niemand wirklich wissen.',tief:false}],
   antwort_flach:'So fühlt es sich an, ein Rest scheint zu fehlen.  Schau eine Schicht tiefer, wo genau soll dieser Rest denn liegen?',
   antwort_tief:'Ja.  Wo keine Zahl mehr dazwischenpasst, sind es zwei Namen für denselben Ort.',
   enthuellung:`Zwischen zwei verschiedenen reellen Zahlen liegt immer eine weitere.  Zwischen 0,999... mit unendlich vielen Neunen und der 1 liegt keine einzige, also sind sie nicht verschieden, sondern gleich.  Das ist bewiesen, kein fast.  Auch anders zu sehen, ein Drittel ist 0,333..., mal drei ergibt 0,999..., und ein Drittel mal drei ist eins.  Cauchy und Weierstraß haben im 19. Jahrhundert genau festgelegt, was so ein unendlicher Ausdruck bedeutet, nämlich der Grenzwert.  Und der ist hier exakt 1.`,
   aha:'Wenn nichts mehr dazwischenpasst, ist es kein Nachbar, es ist derselbe Ort.' },

 { tag:'Achilles und die Schildkröte', mood:{glow:'#12242a', glyph:'🐢', chord:[87,130,174]},
   frage:'Achilles läuft der Schildkröte hinterher.  Immer wenn er ihren Punkt erreicht, ist sie ein Stück weiter, so unendlich oft.  Holt er sie je ein?',
   wahl:[{text:'Nein, sie ist immer ein Stück voraus.',tief:false},{text:'Ja, denn die unendlich vielen immer kleineren Stücke ergeben zusammen eine endliche Strecke.',tief:true},{text:'Nur wenn die Schildkröte stehen bleibt.',tief:false}],
   antwort_flach:'Das klingt zwingend, unendlich viele Schritte, wie soll das je enden?  Schau tiefer, wie lang sind die Schritte zusammen?',
   antwort_tief:'Ja.  Unendlich viele Stücke können eine endliche Summe haben.',
   enthuellung:`Zenon von Elea stellte dieses Rätsel vor rund 2500 Jahren.  Die Auflösung, die Schrittlängen schrumpfen so schnell, dass ihre unendliche Summe endlich bleibt.  0,9 plus 0,09 plus 0,009 und so fort ergibt genau 1.  Man nennt das eine konvergente geometrische Reihe.  Achilles überholt die Schildkröte in endlicher Zeit, obwohl die Rechnung unendlich viele Zwischenschritte hat.`,
   aha:'Unendlich viele Schritte müssen keine unendliche Strecke sein.' },

 { tag:'Wie nah ist nah genug', hardcore:true, mood:{glow:'#201a2f', glyph:'ε', chord:[110,165,220]},
   frage:'Nenn mir einen winzigen Abstand zur 1, so klein du willst.  Was macht die Folge 0,9 dann 0,99 dann 0,999 damit?',
   wahl:[{text:'Sie bleibt am Ende immer weiter weg als irgendein fester Abstand.',tief:false},{text:'Egal wie klein dein Abstand ist, ab irgendwann ist die Folge näher dran als das.',tief:true}],
   antwort_flach:'Es fühlt sich an, als bliebe stets eine feste Lücke.  Schau tiefer, kannst du eine Lücke nennen, die die Folge nicht irgendwann unterbietet?',
   antwort_tief:'Genau.  Jede noch so kleine Schranke wird irgendwann unterschritten.',
   enthuellung:`Das ist der Kern des modernen Grenzwerts, den Karl Weierstraß im 19. Jahrhundert scharf gemacht hat.  Nah dran heißt nicht ein fester kleiner Rest, sondern, für jeden Abstand, den du forderst, komme ich dir näher als das.  Jedes einzelne Folgenglied bleibt echt unter 1, die Reise kommt nie an.  Doch weil kein noch so winziger Abstand übrig bleibt, ist der Grenzwert exakt 1.  Beide Schichten sind wahr, der Weg berührt die 1 nie, das vollendete Ziel ist sie.`,
   aha:'Näher als jeder Abstand, den du nennen kannst, das ist die genaue Bedeutung von berühren.' },

 { tag:'Die Reise die nie ankommt', hardcore:true, mood:{glow:'#2a1a1f', glyph:'→', chord:[73,110,147]},
   frage:'Eine Wahrheit nähert sich der Gewissheit, 0,9 dann 0,99 dann 0,999, Schritt um Schritt.  Erreicht diese Reise je die 1?',
   wahl:[{text:'Ja, beim allerletzten Schritt.',tief:false},{text:'Nein, sie bleibt drunter, also ist 0,999... kleiner als 1.',tief:false},{text:'Kein einzelner Schritt erreicht sie, und doch ist das ganze endlose Zusammen genau die 1.',tief:true}],
   antwort_flach:'Verständlich, ein letzter Schritt wäre schön.  Aber es gibt kein letztes Glied, schau eine Schicht tiefer, wo die 1 dann doch wohnt.',
   antwort_tief:'Ja.  Der Weg berührt sie nie, das vollendete Ganze ist sie.',
   enthuellung:`Hier wohnen zwei Wahrheiten friedlich nebeneinander.  Jedes einzelne Glied, 0,9, dann 0,99, dann 0,999, ist echt kleiner als 1, die Reise kommt an keinem Punkt an, es gibt keinen letzten Schritt.  Und doch ist der Grenzwert der ganzen endlosen Folge exakt 1, so haben es Cauchy und Weierstraß festgelegt.  Der Fehler wäre nur, vom nie ankommenden Weg auf ein kleineres Ziel zu schließen.  Der Prozess erreicht die 1 nie, das vollendete Unendliche IST sie.`,
   aha:'Kein einzelner Schritt erreicht die 1, das Ganze aller Schritte ist sie.' },

 { tag:'Entdecken oder erfinden', mood:{glow:'#0e1408', glyph:'◯', chord:[104,139,156]},
   frage:'Ein Dichter erfindet sein Gedicht frei.  Erfindet ein Mathematiker seinen Satz genauso, oder findet er ihn wie ein fremdes Land?',
   wahl:[{text:'Er erfindet ihn frei, wie der Dichter seine Zeilen.',tief:false},{text:'Er findet ihn, das Land war schon da, er hat es nur zuerst betreten.',tief:true},{text:'Beides ist dasselbe, alles im Kopf ist erfunden.',tief:false}],
   antwort_flach:'Beim Machen fühlt es sich oft wirklich wie freies Erfinden an.',
   antwort_tief:'Ja, er zieht die Grenzen nicht, er zeichnet nur die Karte.',
   enthuellung:`Ein Dichter könnte seine Zeile auch ganz anders schreiben, und beides wäre gültig. Ein Mathematiker aber kann nicht frei wählen, ob es unendlich viele Primzahlen gibt, er kann es nur finden oder verfehlen. Der Zahlentheoretiker G. H. Hardy sah sich als Beobachter, nicht als Erfinder, wie einer, der ferne Berge beschreibt, die schon da sind. Darunter liegt der ganze Unterschied zwischen Dichten und Entdecken.`,
   aha:'Der Dichter erfindet, der Mathematiker entdeckt.' },

 { tag:'Was den Denker überlebt', mood:{glow:'#0c1a2b', glyph:'△', chord:[98,131,196]},
   frage:'Pythagoras ist seit über zweitausend Jahren tot.  Sein Satz über das Dreieck, ist der mit ihm gestorben?',
   wahl:[{text:'Ja, mit dem Mann ist auch sein Wissen vergangen.',tief:false},{text:'Nein, der Satz galt schon vorher und gilt weiter, er kennt keinen Tod.',tief:true},{text:'Er lebt nur weiter, weil wir ihn in Büchern aufbewahren.',tief:false},{text:'Er gilt, solange Menschen ihn unterrichten.',tief:false}],
   antwort_flach:'Es fühlt sich so an, als bräuchte eine Wahrheit jemanden, der sie hält.',
   antwort_tief:'Ja, der Mensch verging, die Wahrheit blieb unberührt.',
   enthuellung:`Der Satz sagt etwas ganz Konkretes: in jedem rechtwinkligen Dreieck ist a mal a plus b mal b gleich c mal c, die beiden kurzen Seiten und die lange Seite stehen für immer in diesem Verhältnis. Man kann es Schritt für Schritt beweisen, und es stimmt bei jedem solchen Dreieck, ob aus Papier oder aus Sternenlicht. Genau darum war es schon in Babylon und Indien bekannt, lange bevor Pythagoras lebte, mehrere Kulturen stießen unabhängig darauf. Der Satz war also wahr, bevor Pythagoras ihn fand, und er bleibt wahr, wenn niemand mehr an ihn denkt. Platon nannte solche Wahrheiten ideal, zu Hause in einer Schicht, die kein Sterben kennt. Nicht der Mann hat die Wahrheit gemacht, er hat sie nur aufgeschrieben. Darunter liegt etwas, das nicht altert.`,
   aha:'Ein Beweis überlebt jeden, der ihn je gedacht hat.' },

 { tag:'Wenn niemand mehr denkt', mood:{glow:'#0b0f1c', glyph:'ℵ', chord:[80,120,160]},
   frage:'Stell dir vor, jedes denkende Wesen im All ist verschwunden.  Ist die Sieben dann noch eine Primzahl?',
   wahl:[{text:'Nein, ohne einen Geist, der es denkt, gibt es keine Zahlen.',tief:false},{text:'Ja, dass sieben sich nur durch eins und sich selbst teilt, hängt an keinem Denker.',tief:true},{text:'Die Frage verliert dann ihren Sinn.',tief:false},{text:'Nur wenn irgendwo die Regeln aufgeschrieben blieben.',tief:false}],
   antwort_flach:'Es liegt nahe, eine Wahrheit an jemanden zu binden, der sie denkt.',
   antwort_tief:'Ja, die Unteilbarkeit der Sieben braucht keinen Zeugen.',
   enthuellung:`Dass sich sieben durch nichts außer eins und sich selbst teilen lässt, ist keine Meinung und keine Abmachung, es ist einfach so, mit oder ohne uns. Diese Haltung nennt man den mathematischen Platonismus, die Zahlen wären wirklich, unabhängig von jedem Kopf. Ob das stimmt, wird bis heute gestritten, doch der Schauer bleibt, dass tiefer als alles Denken eine Wahrheit liegen könnte, die keinen Denker braucht. Vielleicht war die Sieben nie auf uns angewiesen.`,
   aha:'Manche Wahrheit braucht keinen, der sie denkt.' },

 { tag:'Das Delta', hardcore:true, mood:{glow:'#0f2418', glyph:'Δ', chord:[73,110,146]},
   frage:'Du zeigst auf einen Fluss und sagst, das ist die Elbe.  Doch das Wasser von gestern ist längst im Meer.  Was genau nennst du da eigentlich Elbe?',
   wahl:[{text:'Das Wasser, das ist ja das Greifbare.',tief:false},{text:'Das Flussbett, das bleibt wenigstens liegen.',tief:false},{text:'Nicht den Stoff, sondern das Strömen selbst, die Form der Änderung.',tief:true}],
   antwort_flach:'Der Stoff wechselt ständig aus und du sagst trotzdem weiter Elbe.  Schau eine Schicht tiefer.',
   antwort_tief:'Ja, was bleibt, ist das Muster des Fließens, nicht das Material.',
   enthuellung:`Heraklit sagte vor rund 2500 Jahren, in denselben Fluss steige man nicht zweimal, denn stets strömt neues Wasser nach.  Was wir Ding nennen, ist oft eine erstaunlich stabile Änderung, eine Flamme, ein Wirbel, ein Mensch, dessen Zellen sich fast vollständig austauschen.  Newton und Leibniz fanden später eine Sprache genau dafür, die Ableitung, das Delta, die Änderung in einem einzigen Augenblick.  Ob das Strömen wirklicher ist als das Strömende, das bleibt ein Staunen, kein Beweis.`,
   aha:'Vielleicht sind Dinge nur Änderungen, die lange genug dieselbe Form halten.' },

 { tag:'Von Vielleicht zu Ist', hardcore:true, mood:{glow:'#1a1030', glyph:'◈', chord:[65,98,131]},
   frage:'In der Physik kann ein einzelnes Lichtteilchen an mehreren Orten zugleich möglich sein.  Misst du es, ist es plötzlich an genau einem Ort.  Was passiert im Moment des Übergangs?',
   wahl:[{text:'Es war die ganze Zeit schon dort, die Physik wusste es nur nicht.',tief:false},{text:'Der Zufall entscheidet, und damit ist die Sache erledigt.',tief:false},{text:'Aus vielen Möglichkeiten wird eine Wirklichkeit, und wie das geschieht, weiß bis heute niemand.',tief:true}],
   antwort_flach:'So hätten es viele gern, aber sorgfältige Experimente sprechen dagegen.  Schau eine Schicht tiefer.',
   antwort_tief:'Ja, genau dieser Übergang ist eine ehrlich offene Frage der Physik.',
   enthuellung:`In der Quantenphysik ist ein Teilchen vor der Messung ein Bündel von Möglichkeiten, eine sogenannte Überlagerung.  Bei der Messung erscheint genau ein Ergebnis, und was dabei mit allen anderen Möglichkeiten geschieht, ist bis heute ungeklärt, man nennt es das Messproblem.  Niels Bohr und Werner Heisenberg rangen schon vor fast hundert Jahren darum, und noch immer streiten kluge Köpfe über die Deutung.  Der Sprung von möglich zu wirklich ist einer der ehrlichsten offenen Ränder der ganzen Wissenschaft.`,
   aha:'Der Sprung vom Vielleicht ins Ist ist echt und bis heute unerklärt.' },

 { tag:'Der erste Unterschied', mood:{glow:'#0a0a12', glyph:'⟡', chord:[87,116,174]},
   frage:'Vor allem Zählen brauchte es vielleicht nur eines, die Trennung von ist und ist nicht.  War das der Anfang?',
   wahl:[{text:'Nein, die Zahlen kamen zuerst, ganz von selbst.',tief:false},{text:'Vielleicht, aus dem einen Unterschied wächst das Zählen, doch ob es so begann, bleibt offen.',tief:true},{text:'Ja, sicher, so und nicht anders begann die Mathematik.',tief:false},{text:'Der Anfang lässt sich gar nicht denken.',tief:false}],
   antwort_flach:'Nach einem festen Anfang zu suchen, ist ein sehr menschlicher Trost.',
   antwort_tief:'Ja, du hältst die Möglichkeit offen, ohne sie zur Gewissheit zu machen.',
   enthuellung:`Aus einem einzigen Unterschied, eins und nicht eins, lässt sich erstaunlich viel bauen, Leibniz träumte von einer Welt aus Null und Eins, und unsere Rechner leben heute davon. Ob die erste Trennung von ist und ist nicht wirklich der Ursprung aller Ordnung war, weiß niemand. Aber es ist ein schöner Gedanke, dass unter allem Zählen eine noch tiefere Schicht liegt, der bloße Unterschied. Ein Staunen, kein Beweis.`,
   aha:'Vielleicht beginnt alle Ordnung mit einem einzigen Unterschied.' },

 { tag:'Vor dem ersten Licht', mood:{glow:'#050a14', glyph:'✧', chord:[82,110,164]},
   frage:'War die Ordnung, dass eins und eins zwei ergibt, schon da, bevor der erste Stern brannte?',
   wahl:[{text:'Ja, ganz sicher, sie ist ewig und stand über allem.',tief:false},{text:'Das wissen wir nicht, und genau dieses Nichtwissen ist das Wunder.',tief:true},{text:'Nein, Ordnung entstand erst mit der Welt.',tief:false},{text:'Ordnung gibt es nur, wo jemand hinschaut.',tief:false}],
   antwort_flach:'Der Wunsch, es sicher zu wissen, ist tief und ehrlich.',
   antwort_tief:'Ja, hier ehrst du das Geheimnis, statt es zu füllen.',
   enthuellung:`Ob die mathematische Ordnung dem Universum vorausging, ist eine der ältesten Fragen, und ehrlicherweise wissen wir es nicht. Manche, wie der Physiker Max Tegmark, vermuten, die Welt sei im Kern selbst Mathematik, andere widersprechen entschieden. Die tiefere Schicht hier ist keine Antwort, sondern der Schauer vor einer Frage, die vielleicht größer ist als jede Antwort. Staunen darf man, behaupten nicht.`,
   aha:'Manche Wahrheit ist so groß, dass Staunen ehrlicher ist als Wissen.' },

 /* ===== ENDE PREMIUM-KANDIDATEN ===== */

 { tag:'Die Meisterfrage', mood:{glow:'#c98a2e', glyph:'◠', chord:[98.00,146.83,196.00]},
   bild:`<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Die berühmte erste Zeichnung aus Der kleine Prinz: eine Boa, die einen Elefanten verschluckt hat und wie ein Hut aussieht"><defs><radialGradient id="lp-belly" cx="46%" cy="64%" r="62%"><stop offset="0%" stop-color="#e9c26a" stop-opacity="0.20"/><stop offset="55%" stop-color="#e9c26a" stop-opacity="0.08"/><stop offset="100%" stop-color="#e9c26a" stop-opacity="0"/></radialGradient></defs><path d="M 27,142 C 59,135 90,132 119,127 C 151,121 167,50 196,39 C 224,28 251,79 286,116 C 322,141 361,146 399,150 C 335,164 251,161 189,159 C 128,157 71,157 27,142 Z" fill="url(#lp-belly)" stroke="#e9c26a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
   frage:'Sieh dir dieses Bild an.  Was ist das?',
   wahl:[{text:'Ein Hut.',tief:false},{text:'Nur Pixel und Regeln, die ein Bild zeichnen.',tief:false},{text:'Eine Zeichnung, ein Zeichen für etwas.',tief:false},{text:'Eine Schlange, die einen Elefanten verschluckt hat.',tief:true}],
   antwort_flach:'Eine wahre Schicht. Aber dieses eine Bild trägt mehr als sie. Sieh genauer.',
   antwort_tief:'Ja. Du hast gesehen, was der kleine Prinz sah, und die Erwachsenen nie.',
   enthuellung:`Schau, wie viele Schichten in einer einzigen Linie stecken.
Ganz unten sind es nur Nullen und Einsen, Regeln, die deinem Bildschirm sagen, welche Punkte hell werden. Das ist die Schicht, auf der die Maschine lebt.
Eine Schicht darüber macht dein Auge aus diesen Punkten sofort ein Ding, einen Hut. Genau dort blieben die Erwachsenen im Buch stehen und fragten nie weiter.
Aber es ist kein Hut. Es ist eine Riesenschlange, die einen Elefanten verschluckt hat, dieselbe Linie, eine Bedeutung tiefer.
Und selbst das trägt das Bild nicht in sich. Es zeigt nur. Welche Schicht du siehst, entsteht erst beim Hinsehen.`,
   aha:'Ein Bild ist nie das Ding, es ist eine Tür durch viele Schichten, und wie tief du gehst, entscheidest du.' },

 { tag:'Der letzte Layer', mood:{glow:'#e0b24e', glyph:'◉', chord:[130.81,164.81,196.00]},
   frage:'Und jetzt ehrlich, was war eigentlich der nächste Layer?',
   wahl:[{text:'Die nächste Frage.',tief:false},{text:'Ich. Gerade eben.',tief:true}],
   antwort_flach:'Fast, schau nochmal, wer hier tiefer gegangen ist.',
   antwort_tief:'Ja. Du.',
   enthuellung:`Jede Frage hat dich eine Schicht tiefer gebracht, von den Zeichen zur Bedeutung, vom Ding zum Unterschied, von der Schleife zum „Ich“. Der nächste Layer warst nie die Aufgabe. Es war dein Denken, das sich selbst eine Ebene tiefer gestellt hat.`,
   aha:'Der nächste Layer bist du, sobald du eine Schicht tiefer denkst.' }
];

/* ============================ AMBIENT-SOUND ============================ */
const Audio = (function(){
  let ctx=null, master=null, drones=[], lp=null, lfo=null, bellTimer=null, on=false;
  const mobileAudio=!!(window.matchMedia&&matchMedia('(max-width: 700px), (pointer: coarse)').matches);
  const targetVolume=mobileAudio?0.18:0.34;
  function init(){
    if(ctx) return;
    const AC = window.AudioContext||window.webkitAudioContext;
    // latencyHint 'playback' = groesserer Audio-Puffer. Fuer Hintergrund-Ambient ist es egal, ob der
    // Ton ein paar ms spaeter kommt, aber der groessere Puffer beugt Aussetzern/Rattern auf schwaecheren
    // Rechnern vor (der haeufigste Grund fuer "es rattert bei ihr, bei mir nicht").
    try{ ctx = new AC({ latencyHint:'playback' }); }catch(e){ ctx = new AC(); }
    master = ctx.createGain(); master.gain.value=0.0;
    const compressor=ctx.createDynamicsCompressor(); compressor.threshold.value=-24; compressor.knee.value=18;
    compressor.ratio.value=4; compressor.attack.value=0.015; compressor.release.value=0.3;
    master.connect(compressor); compressor.connect(ctx.destination);
    lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=mobileAudio?620:760; lp.Q.value=0.35; lp.connect(master);
    lfo = ctx.createOscillator(); const lg=ctx.createGain(); lfo.frequency.value=0.04; lg.gain.value=mobileAudio?30:90;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    [0,1,2].forEach(()=>{ const o=ctx.createOscillator(); o.type='sine'; const g=ctx.createGain(); g.gain.value=mobileAudio?0.045:0.09;
      o.connect(g); g.connect(lp); o.start(); drones.push({o,g}); });
    setChord([110,164.81,220]);
    if(!mobileAudio) scheduleBell();
  }
  function setChord(ch){ if(!ctx) return; drones.forEach((d,i)=>{ const f=ch[i]||ch[ch.length-1];
    const safeF=mobileAudio&&f<120?f*2:f;
    d.o.frequency.cancelScheduledValues(ctx.currentTime); d.o.frequency.setTargetAtTime(safeF, ctx.currentTime, 1.8); }); }
  function bell(){ if(!ctx||!on) return; const scale=[220,261.63,293.66,349.23,392,440,523.25];
    const f=scale[Math.floor((Math.sin(ctx.currentTime*97.13)*0.5+0.5)*scale.length)%scale.length];
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ctx.createGain(); const t=ctx.currentTime;
    // Sanfter, exponentiell aus- und einblendender Ton (keine Rampe aus/zu 0 -> kein Klick).
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.05,t+0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+4.2);
    // EIN sanftes Echo, aber KEINE Rueckkopplungs-Schleife mehr. Die alte dl->fb->dl-Schleife
    // erzeugte beim Ausklingen Denormal-Zahlen, die auf manchen CPUs Rechenspitzen und damit
    // genau dieses Rattern/Aussetzen im Ton verursachen. Ein einfacher Delay-Tap kann das nicht.
    const dl=ctx.createDelay(); dl.delayTime.value=0.33; const eg=ctx.createGain(); eg.gain.value=0.16;
    o.connect(g); g.connect(lp); g.connect(dl); dl.connect(eg); eg.connect(lp);
    o.start(t); o.stop(t+4.4);
    o.onended=()=>{ try{ o.disconnect(); g.disconnect(); dl.disconnect(); eg.disconnect(); }catch(e){} };
  }
  function scheduleBell(){ const wait=5200+Math.abs(Math.sin((ctx?ctx.currentTime:0)*13.7))*4200;
    bellTimer=setTimeout(()=>{ if(ctx&&ctx.state==='suspended'&&on){ ctx.resume().catch(()=>{}); } bell(); scheduleBell(); }, wait); }
  return {
    toggle(){ init(); if(ctx.state==='suspended')ctx.resume(); on=!on;
      master.gain.setTargetAtTime(on?targetVolume:0.0, ctx.currentTime, 0.45); return on; },
    ensure(){ init(); if(ctx.state==='suspended')ctx.resume(); if(!on){ on=true; master.gain.setTargetAtTime(targetVolume,ctx.currentTime,1.2);} },
    chord:setChord, isOn(){return on;}
  };
})();

/* ============================ CODE-DRIFT (lebendiger Hintergrund) ============================ */
const CodeDrift = (function(){
  const cv=document.getElementById('code'), cx=cv.getContext('2d');
  const TOKENS=['0','1','0','1','01','10','if','then','fn','=>','{ }','( )','01001','λ','Δ','∑','→','||','&&','==','x++','sha','1010','true','void','def','0 1'];
  let W=0,H=0,DPR=1,toks=[],color='185,205,240',reduce=false,raf=0,last=0,hidden=false,rz=0;
  const mobileVisual=!!(window.matchMedia&&matchMedia('(max-width: 700px), (pointer: coarse)').matches);
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function mk(y){ const size=rnd(11,22); return { x:rnd(0,W), y:(y==null?rnd(-H,H):y), size,
    speed:rnd(6,10)+(22-size)*1.1, text:TOKENS[(Math.random()*TOKENS.length)|0],
    phase:rnd(0,6.28), tw:rnd(0.4,1.1), base:0.08+(size-11)/11*0.18 }; }
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,mobileVisual?1.5:2); W=innerWidth; H=innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cx.setTransform(DPR,0,0,DPR,0,0);
    const n=Math.max(24,Math.min(80,Math.round(W*H/16000))); toks=[]; for(let k=0;k<n;k++) toks.push(mk());
    if(reduce) draw(true); }
  function draw(staticOnly){ cx.clearRect(0,0,W,H); cx.textAlign='center'; cx.textBaseline='middle';
    for(const o of toks){ const a=o.base*(staticOnly?0.8:(0.55+0.45*Math.sin(o.phase)));
      cx.font=o.size+'px ui-monospace,Menlo,Consolas,monospace'; cx.fillStyle='rgba('+color+','+a.toFixed(3)+')';
      cx.fillText(o.text,o.x,o.y); } }
  function step(ts){ raf=requestAnimationFrame(step);
    if(hidden){ last=0; return; }
    if(last && ts-last<(mobileVisual?66:32)) return; // mobil 15 fps: scharfes Bild ohne die Audiokette auszuhungern
    const dt=last?Math.min((ts-last)/1000,0.05):0.016; last=ts;
    for(const o of toks){ o.y+=o.speed*dt; o.phase+=o.tw*dt; if(o.y>H+20) Object.assign(o,mk(-20)); }
    draw(false); }
  return {
    init(){ reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches); resize();
      addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(resize,180); });
      document.addEventListener('visibilitychange',()=>{ hidden=document.hidden; last=0; });
      if(!reduce){ last=0; raf=requestAnimationFrame(step); } },
    tint(hex){ const m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex||''); if(!m) return;
      const r=parseInt(m[1],16),g=parseInt(m[2],16),b=parseInt(m[3],16), mix=(c,l)=>Math.round(c*0.45+l*0.55);
      color=mix(r,185)+','+mix(g,205)+','+mix(b,240); }
  };
})();

/* ============================ ENGINE ============================ */
const stack=document.getElementById('stack'), bgEl=document.getElementById('bg'), glyphEl=document.getElementById('glyph'),
      ptsEl=document.getElementById('pts'), sndBtn=document.getElementById('snd');
let i=0, score=0, answeredNow=false, tiefNow=null;
const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* Fortschritt lokal merken, damit man nach einem Rausschmiss genau hier weitermacht.
   Kein Zurueckgehen, nur automatisches Zwischenspeichern, das ehrliche Ergebnis bleibt. */
const PKEY='tiefer_progress';
function saveProgress(answered,tief){ try{ localStorage.setItem(PKEY, JSON.stringify({i, score, answered:!!answered, tief:(tief==null?null:!!tief), ts:Date.now()})); }catch(e){} }
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(PKEY)||'null'); }catch(e){ return null; } }
function clearProgress(){ try{ localStorage.removeItem(PKEY); }catch(e){} }
const MAX = LEVELS.reduce((s,l)=> s + Math.max(...l.wahl.map(w=>w.tief?3:1)), 0);

function el(t,c,h){const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;}
function setMood(m){ bgEl.style.background = `radial-gradient(1100px 760px at 50% 6%, ${m.glow} -40%, #070a14 55%, #05060c 100%)`;
  glyphEl.textContent=m.glyph; glyphEl.style.opacity='.05'; Audio.chord(m.chord); CodeDrift.tint(m.glow); }
function ghost(n){ const g=el('div','ghost'); const d=70+n*46;
  g.style.transform=`translateZ(${-d}px) translateY(${34+n*10}px)`; g.style.opacity=String(Math.max(.08,.5-n*.08)); return g; }
function type(node,text,done,host){ if(REDUCE){ node.textContent=text; if(host) host.scrollTop=host.scrollHeight; if(done)done(); return; }
  node.textContent=''; let k=0; (function tick(){ if(k<=text.length){ node.textContent=text.slice(0,k); k++;
  if(host && (text[k-1]==='\n' || (k%5)===0) && host.scrollHeight-host.scrollTop-host.clientHeight<80) host.scrollTop=host.scrollHeight;
  setTimeout(tick, text[k-1]==='\n'?60:13);} else if(done)done(); })(); }

function start(){
  setMood({glow:'#3a2f7a', glyph:'?', chord:[110,164.81,220]});
  const c=el('div','card coming center');
  c.innerHTML = '<div class="tag fade" style="text-align:center">bevor du eintauchst</div>'
    + '<h1 class="fade">Wie prüfst du eine überzeugende Antwort?</h1>'
    + '<p class="lead fade">TIEFER ist ein freiwilliges Denkspiel über Zeichen, Erklärungen und Perspektiven. Du wählst Antworten und liest anschließend, welche Annahme darunterliegt.</p>'
    + '<div class="terms fade">'
      + '<div class="termrow"><b>Kein Intelligenztest:</b> Punkte und Rang sind Spielmechanik, keine Diagnose deiner Begabung oder deines Werts.</div>'
      + '<div class="termrow"><b>Pause:</b> Du kannst jederzeit verlassen und im selben Browser fortsetzen.</div>'
      + '<div class="termrow"><b>Speicher:</b> Gerätewechsel, anderer Browser, privater Modus oder gelöschte Website-Daten können deinen Stand entfernen. Ein Lernstudio-Konto synchronisiert TIEFER derzeit nicht.</div>'
      + '<div class="termrow"><b>Lernen:</b> Das Spiel vergibt lokale Denkpunkte. Alle Lernpfade sind kostenlos.</div>'
    + '</div>'
    + '<p class="lead fade" style="color:var(--gold)">Wenn diese Bedingungen für dich passen, gehen wir Schicht für Schicht tiefer.</p>'
    + '<p class="fade"><button class="btn" id="go">Mit diesen Bedingungen beginnen ↓</button></p>';
  stack.appendChild(c); enter(c);
  c.querySelector('#go').onclick=(e)=>{ e.currentTarget.disabled=true; Audio.ensure(); sndBtn.classList.add('on'); sndBtn.setAttribute('aria-pressed','true'); leave(c); i=0; setTimeout(render,300); };
}
function enter(c){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ c.classList.remove('coming'); c.classList.add('active'); })); }
function leave(c){ c.classList.remove('active'); c.classList.add('gone'); setTimeout(()=>c.remove(),950); }

function render(restore){
  const L=LEVELS[i]; setMood(L.mood);
  document.body.classList.add('playing');
  const wieder = !!(restore && restore.answered);
  answeredNow = wieder; tiefNow = wieder ? restore.tief : null;
  if(!restore) saveProgress(false,null);          // frische Schicht: Stand sichern
  [...stack.querySelectorAll('.ghost')].forEach(g=>g.remove());
  for(let n=Math.min(i,4); n>=1; n--) stack.appendChild(ghost(n));
  const c=el('div','card coming'); c.appendChild(el('div','tag',L.tag));
  if(L.hardcore) c.appendChild(el('div','iq','extra knifflig'));
  if(L.bild){ const b=el('div','bild'); b.innerHTML=L.bild; c.appendChild(b); }
  const frage=el('div','frage'); c.appendChild(frage);
  const waehl=el('div','waehl'); c.appendChild(waehl);
  const reveal=el('div','hidden'); c.appendChild(reveal);
  stack.appendChild(c); enter(c);
  if(wieder){ frage.textContent=L.frage; } else { type(frage,L.frage); }
  L.wahl.forEach(w=>{ const b=el('button',null,w.text); b.onclick=()=>{
    [...waehl.children].forEach(x=>x.disabled=true); b.style.borderColor=w.tief?'var(--good)':'var(--accent)';
    const got=w.tief?3:1; score+=got; ptsEl.textContent=score;
    answeredNow=true; tiefNow=w.tief; saveProgress(true,w.tief);
    showReveal(c,reveal,L,w.tief,got);
  }; waehl.appendChild(b);
    if(wieder){ b.disabled=true; if(!!w.tief===!!restore.tief){ b.style.borderColor=w.tief?'var(--good)':'var(--accent)'; } }
  });
  if(wieder){ showReveal(c,reveal,L,restore.tief,restore.tief?3:1); }
}

function showReveal(card,reveal,L,tief,got){
  reveal.classList.remove('hidden');
  const r=el('div','reaktion'+(tief?' tief':''), tief?L.antwort_tief:L.antwort_flach);
  const enth=el('div','enth'); const pts=el('div','pts hidden', '+'+got+' Genie-Punkte');
  const aha=el('div','aha hidden','↳ '+L.aha);
  const wrap=el('div'); const btn=el('button','btn hidden', i<LEVELS.length-1?'Tiefer ↓':'Ans Licht ✦');
  reveal.append(r,enth,pts,aha,wrap); wrap.appendChild(btn);
  type(enth,L.enthuellung,()=>{ pts.classList.remove('hidden'); aha.classList.remove('hidden'); btn.classList.remove('hidden'); btn.classList.add('fade'); card.scrollTop=card.scrollHeight; }, card);
  btn.onclick=()=>{ if(btn.disabled) return; btn.disabled=true; leave(card); i++;
    if(i<LEVELS.length){ answeredNow=false; tiefNow=null; saveProgress(false,null); render(); }
    else { clearProgress(); ende(); } };
}

/* TIEFER-Rang. Lokaler Denkspielrang, ohne Geld- oder Tokenfunktion. */
const FAZIT = {
  10:'Das war kein Zufall. Du hast fast jedes Mal die Schicht darunter gesehen, genau das Denken, um das es geht, nicht auswendig lernen, eine Schicht tiefer sehen. Bis daraus echtes Können wird, geht es noch weiter nach unten.',
  7:'Du hast gegraben und Gold gefunden, und ein paarmal an der Kante gestoppt. Genau an dieser Kante fängt das Lernen an, eine Schicht tiefer, als sich sicher anfühlt.',
  5:'Du hast begonnen, erste Antworten nicht einfach stehen zu lassen. Die Oberfläche ist ein Ausgangspunkt, und der Weg zu genaueren Fragen steht dir offen.'
};
const RANGTEXT = {
  10:'<b>Tiefseetaucher.</b> Du warst fast jedes Mal unter der ersten Antwortschicht.',
  7:'<b>Schürfer.</b> Du hast gegraben und mehr als einmal Gold gefunden.',
  5:'<b>Erkundender.</b> Du hast den ersten Schritt unter eine schnelle Antwort gemacht.'
};
function tier(s){ const p=s/MAX;
  if(p>=0.82) return {rang:'🌌 Tiefseetaucher', niveau:10};
  if(p>=0.55) return {rang:'🔦 Schürfer', niveau:7};
  return {rang:'🌊 Erkundender', niveau:5}; }
function escH(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function ende(){
  clearProgress(); document.body.classList.remove('playing');
  const jetzt=tier(score);
  // Baseline = der erste ehrliche Lauf. Sie bleibt lokal in diesem Browser gespeichert.
  let base=null; try{ base=JSON.parse(localStorage.getItem('tiefer_baseline')||'null'); }catch(e){}
  const wiederlauf=!!base;
  if(!base){ base={score:score, max:MAX, rang:jetzt.rang, niveau:jetzt.niveau, ts:Date.now()};
    try{ localStorage.setItem('tiefer_baseline', JSON.stringify(base)); }catch(e){} }
  const niveau=base.niveau||base.rabatt||jetzt.niveau;
  setMood({glow:'#e0b24e', glyph:'◉', chord:[130.81,164.81,196]});
  [...stack.querySelectorAll('.ghost')].forEach(g=>g.remove());
  for(let n=4;n>=1;n--) stack.appendChild(ghost(n));
  const c=el('div','card coming center');
  let html =
    '<h1 class="fade">Du hast das Licht erreicht.</h1>'
   +'<div class="big fade">'+escH(base.score)+' / '+escH(base.max)+'</div>'
   +'<div class="rank fade">'+escH(base.rang)+'</div>'
    +'<p class="lead fade">'+FAZIT[niveau]+'</p>'
    +(wiederlauf?'<p class="lead fade" style="color:var(--good); font-size:13.5px">Das war dein erster, ehrlicher Lauf. Dein Rang bleibt in diesem Browser gespeichert.</p>':'')
   +'<div class="codebox fade">Wenn dir diese Art des Fragens liegt, kannst du im Lernstudio alle Lernpfade aus HTML, Computerlogik, Mathematik und Alltag erkunden.<br><span style="color:var(--dim);font-size:12.5px">Dein Spielergebnis bleibt lokal. Alle Lernpfade sind frei zugänglich.</span></div>'
   +'<div class="angebot fade">'
    +'<p class="rangtext">'+RANGTEXT[niveau]+'</p>'
    +'<p class="motto">Wissen darf kein Vermögen kosten.</p>'
    +'<p class="feindruck">Dein erstes Spielergebnis merkt sich nur dieser Browser lokal. Du kannst kostenlos weiterlernen.</p>'
   +'</div>'
   +'<div class="aktion fade">'
    +'<a class="btn" href="studio.html">Freie Lektionen ausprobieren</a>'
    +'<a class="btn ghostbtn" href="angebot.html">Angebot in Ruhe lesen</a>'
   +'<button class="btn ghostbtn" onclick="location.reload()">Nochmal tauchen ↺</button>'
   +'</div>';
  c.innerHTML = html;
  stack.appendChild(c); enter(c);
}

sndBtn.onclick=()=>{ const on=Audio.toggle(); sndBtn.classList.toggle('on',on); sndBtn.setAttribute('aria-pressed', on?'true':'false'); sndBtn.setAttribute('aria-label',on?'Ruhigen Ton ausschalten':'Ruhigen Ton einschalten'); };

/* Willkommen-zurueck-Karte: ein Klick, dann genau an der gespeicherten Schicht weiter. */
function resumeCard(p){
  i=p.i; score=p.score||0; ptsEl.textContent=score;
  setMood({glow:'#3a2f7a', glyph:'?', chord:[110,164.81,220]});
  const c=el('div','card coming center');
  c.innerHTML = '<div class="tag fade" style="text-align:center">willkommen zurück</div>'
    +'<h1 class="fade">Weiter, wo du warst</h1>'
    +'<p class="lead fade">Dein Lauf ist gespeichert. Du bist bei Schicht '+(p.i+1)+' von '+LEVELS.length+', mit '+score+' Genie&#8209;Punkten.</p>'
    +'<p class="lead fade" style="color:var(--gold)">Wir tauchen weiter nach unten, nicht zurück. Dein ehrliches Ergebnis bleibt.</p>'
    +'<p class="fade"><button class="btn" id="go">Weiter tauchen ↓</button> <button class="btn ghostbtn" id="fresh">Von vorne</button></p>';
  stack.appendChild(c); enter(c);
  c.querySelector('#go').onclick=(e)=>{ e.currentTarget.disabled=true; Audio.ensure(); sndBtn.classList.add('on'); sndBtn.setAttribute('aria-pressed','true'); leave(c); setTimeout(()=>render(p.answered?{answered:true,tief:p.tief}:null),300); };
  c.querySelector('#fresh').onclick=()=>{ clearProgress(); i=0; score=0; ptsEl.textContent='0'; leave(c); setTimeout(start,300); };
}

/* Speichern-Knopf: es wird ohnehin laufend gespeichert, hier nur die ehrliche Beruhigung + Hinweis. */
const saveBtn=document.getElementById('save'), toastEl=document.getElementById('toast');
let toastT=0;
function toast(msg){ toastEl.innerHTML=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'), 7000); }
saveBtn.onclick=()=>{ saveProgress(answeredNow,tiefNow);
  toast('<b>Gespeichert.</b> Du kannst die Seite jetzt schließen und später genau hier weitermachen. Hinweis: Bleibst du sehr lange weg oder löscht dein Browser die Daten (privater Modus, Verlauf löschen), kann der Fortschritt weg sein. Dann fängst du neu an.'); };

CodeDrift.init();
const _p=loadProgress();
if(_p && typeof _p.i==='number' && _p.i>=0 && _p.i<LEVELS.length){ resumeCard(_p); }
else { clearProgress(); start(); }
</script>
