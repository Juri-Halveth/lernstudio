<style>

  .tag{font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-bottom:12px}

  .bild{ display:flex; justify-content:center; margin:2px 0 18px }

  .brand{ min-width:0 }

<script>
/* ============================ DATEN ============================ */
const LEVELS = [
 { tag:'Zeichen & Bedeutung', mood:{glow:'#2f5bd0', glyph:'=', chord:[110.00,164.81,220.00]},
   frage:'1 = 2.  Wahr oder falsch?',
   wahl:[{text:'Falsch, natürlich.',tief:false},{text:'Wahr.',tief:false},{text:'Kommt drauf an, was 1 und 2 bedeuten.',tief:true}],
   antwort_flach:'So denken fast alle, und auf der Oberfläche stimmt es auch.',
   antwort_tief:'Du siehst schon tiefer. Genau.',
   enthuellung:`Als bloße Zeichen, falsch. Aber Gleichheit betrifft nie die Zeichen, sondern das, worauf sie zeigen.
Schreib a = 5 und b = 5, dann ist a = b, obwohl die Namen verschieden sind. „Morgenstern“ und „Abendstern“ sind zwei Wörter für einen Planeten, Venus.`,
   aha:'Ein Zeichen ist nicht seine Bedeutung, es zeigt nur auf sie, eine Schicht tiefer.' },

 { tag:'Der Zeiger', mood:{glow:'#c85a3a', glyph:'🍎', chord:[130.81,196.00,261.63]},
   frage:'🍎  Ist das ein Apfel?',
   wahl:[{text:'Ja.',tief:false},{text:'Nein, das ist ein Zeichen für einen Apfel.',tief:true}],
   antwort_flach:'Verständlich, dein Kopf hat sofort den Apfel gesehen.',
   antwort_tief:'Genau, du hast das Zeichen vom Ding getrennt.',
   enthuellung:`Kein Symbol trägt seine Bedeutung in sich, es verweist. Auf dem Bildschirm ist der Apfel zuerst nur ein Ausdruck in Code, Nullen und Einsen, die jedem winzigen Bildpunkt eine Farbe zuweisen, tausende rote und grüne Lichtpunkte in einem Raster. Dein Auge fängt dieses Licht, dein Gehirn macht daraus auf seine ganz eigene Art ein Ding, einen Apfel. Der Apfel entsteht also nicht auf dem Bildschirm, sondern eine Schicht tiefer, in dir. Das Zeichen ist die Tür, nicht der Raum.`,
   aha:'Bedeutung liegt nie im Symbol, sondern in dem, worauf es zeigt.' },

 { tag:'Wo die Traurigkeit wohnt', mood:{glow:'#1a2740', glyph:'♭', chord:[110.00,130.81,164.81]},
   frage:'Ein Mollakkord klingt traurig.  Wo steckt die Traurigkeit?',
   wahl:[{text:'In den Tönen selbst.',tief:false},{text:'In den tiefen, dunklen Frequenzen.',tief:false},{text:'In der langsamen Melodie.',tief:false},{text:'In dir, der Klang weckt sie nur.',tief:true}],
   antwort_flach:'Fast alle zeigen auf den Klang, und er fühlt sich ja wirklich traurig an.',
   antwort_tief:'Ja. Der Klang trägt keine Trauer, er ruft deine.',
   enthuellung:`In den Frequenzen selbst steckt keine Traurigkeit, nur Schwingung, Zahlen in der Luft. Erst dein Gehirn legt Bedeutung darüber, geformt von Sprache, Kultur und Erinnerung. Ein Gefühl ist ein Körperzustand plus der Sinn, den du ihm gibst, eine Schicht tiefer als der bloße Ton (Damasio nennt diese Brücke somatische Marker). Ein Kind, das den Klang nie mit Abschied verband, hört vielleicht nur dunkel und weich.`,
   aha:'Der Ton schwingt, die Trauer entsteht eine Schicht tiefer in dir.' },

 { tag:'Gleichheit prüfen', mood:{glow:'#1f9e8f', glyph:'≡', chord:[123.47,185.00,246.94]},
   frage:'a = 5 und b = 5.  Ist a dasselbe wie b?',
   wahl:[{text:'Nein, es sind verschiedene Namen.',tief:false},{text:'Ja, sie zeigen auf denselben Wert.',tief:true}],
   antwort_flach:'Die Namen sind verschieden, ja, aber schau eine Ebene tiefer.',
   antwort_tief:'Ja, du prüfst, worauf sie zeigen, nicht wie sie heißen.',
   enthuellung:`Um zu entscheiden, ob zwei Dinge gleich sind, gehst du eine Schicht tiefer, zu ihren Werten, und vergleichst dort. In echten Beweis-Systemen (Lean, Coq) heißt genau das „definitorische Gleichheit“.`,
   aha:'Um Gleichheit zu prüfen, faltet man die Definitionen auf, eine Schicht tiefer.' },

 { tag:'Was die Gänsehaut weiß', mood:{glow:'#2b1d3a', glyph:'∿', chord:[82.41,98.00,123.47]},
   frage:'Eine Melodie, und plötzlich Gänsehaut.  Was ist da gerade passiert?',
   wahl:[{text:'Dir ist einfach kalt geworden.',tief:false},{text:'Ein uralter Reflex, der wie bei Tieren das Fell sträuben will.',tief:false},{text:'Dein Körper feiert einen Moment, den dein Inneres als bedeutsam erkennt.',tief:true}],
   antwort_flach:'Kälte spielt manchmal mit, und doch kommt die Gänsehaut auch im warmen Raum.',
   antwort_tief:'Genau. Der Körper antwortet, bevor du es in Worte fassen kannst.',
   enthuellung:`Gänsehaut entsteht, wenn winzige Muskeln an jeder Haarwurzel sich zusammenziehen und das Haar aufrichten, gesteuert vom vegetativen Nervensystem mit einem Stoß Adrenalin. Bei Tieren mit Fell plustert dieser uralte Reflex das Fell auf, gegen Kälte oder um größer zu wirken. Bei dir feuert derselbe Reflex bei Schönheit, bei einer Stimme, die kippt, bei einer Wahrheit, die trifft. Der Körper reagiert eine Schicht schneller als der Gedanke, er markiert Bedeutung, ehe du sie begreifst. Das Gefühl wohnt zuerst im Leib und erst danach im Kopf.`,
   aha:'Manchmal weiß dein Körper eine Schicht früher als du, dass etwas zählt.' },

 { tag:'Der Abdruck', mood:{glow:'#3a7fb0', glyph:'⌗', chord:[110.00,146.83,196.00]},
   frage:'sha256(„Hallo“) = 753692ec…  Was ist dieser Hash?',
   wahl:[{text:'Der Text, nur verschlüsselt.',tief:false},{text:'Ein Fingerabdruck des ganzen Zustands.',tief:true},{text:'Reiner Zufall.',tief:false}],
   antwort_flach:'Nah dran, aber nicht ganz, Verschlüsselung kann man zurückdrehen.',
   antwort_tief:'Ja, ein Abdruck, kein Behälter.',
   enthuellung:`Ein Hash trägt den Text nicht in sich. Er beweist nur, DASS genau dieser Zustand existiert hat, wie ein Fossil, ein Echo. Und er ist Einweg, vorwärts abdrucken geht, rückwärts zurückrechnen nicht. Willst du die Vergangenheit, musst du sie gespeichert haben.`,
   aha:'Ein Fingerabdruck beweist die Existenz eines Zustands, ohne ihn zu tragen.' },

 { tag:'Die Erinnerung, die sich schreibt', mood:{glow:'#3a2a18', glyph:'⟲', chord:[73.42,87.31,110.00]},
   frage:'Du holst eine Erinnerung hervor.  Bleibt sie danach dieselbe?',
   wahl:[{text:'Ja, sie liegt fest wie ein Foto.',tief:false},{text:'Sie verblasst mit den Jahren, sonst bleibt sie gleich.',tief:false},{text:'Nur wenn ich sie laut erzähle, ändert sie sich.',tief:false},{text:'Nein, jedes Erinnern schreibt sie leise neu.',tief:true}],
   antwort_flach:'Es fühlt sich an wie ein Foto im Album, verlässlich und fertig.',
   antwort_tief:'Ja. Du erinnerst nicht den Moment, du erinnerst dein letztes Erinnern.',
   enthuellung:`Das Gehirn bewahrt keine fertige Aufnahme wie ein Foto. Hirnforscher fanden, dass eine Erinnerung im Moment des Abrufs kurz formbar wird und danach neu abgespeichert werden muss, sie nennen das Rekonsolidierung. Dabei baut das Gehirn die Szene jedes Mal neu zusammen und färbt sie mit dem Heute. So legt jedes Erinnern eine dünne neue Schicht darüber, und das Bild wandert mit dir durch die Jahre. Was du für den Ursprung hältst, ist oft die letzte Kopie der Kopie.`,
   aha:'Du erinnerst nie den Moment selbst, nur die letzte Schicht darüber.' },

 { tag:'Wo Information entsteht', mood:{glow:'#2fae63', glyph:'Δ', chord:[98.00,146.83,196.00]},
   frage:'Ein einzelnes Teilchen, sonst nichts.  Trägt es Information?',
   wahl:[{text:'Ja, es ist ja da.',tief:false},{text:'Nein, es fehlt etwas, wovon es sich unterscheidet.',tief:true}],
   antwort_flach:'Es ist da, klar, aber „da sein“ ist noch keine Information.',
   antwort_tief:'Genau, ohne ein Zweites bedeutet das Erste nichts.',
   enthuellung:`Information IST Unterschied, „a difference that makes a difference“ (Bateson). Ein einzelner Zustand allein sagt nichts, solange es nichts gibt, wovon er sich abhebt. Erst das Zweite gebiert Bedeutung. Der Sinn wohnt im Dazwischen, nicht im Ding.`,
   aha:'Bedeutung wird im Unterschied geboren, nie im einzelnen Ding.' },

 { tag:'Die Kante der Farbe', mood:{glow:'#2a1a10', glyph:'◐', chord:[110,165,220]},
   frage:'Ein Regenbogen geht von Rot zu Orange.  Zeig mit dem Finger auf die Stelle, wo genau es wechselt.  Wo sitzt die Kante?',
   wahl:[{text:'Da ist eine feine Linie, man muss nur genau genug hinschauen.',tief:false},{text:'Ungefähr in der Mitte, dort wo es kippt.',tief:false},{text:'Es gibt keine Stelle, die Farbe fließt stetig, die Kante malst du selbst hinein.',tief:true}],
   antwort_flach:'Je näher du hinschaust, desto mehr verschwindet die feine Linie.  Schau eine Schicht tiefer.',
   antwort_tief:'Ja, die Grenze entsteht in deinem Auge, nicht im Licht.',
   enthuellung:`Das Licht im Regenbogen ändert seine Wellenlänge ganz stetig, ohne Sprung, ohne Naht.  Es gibt keinen Punkt, an dem Rot endet und Orange beginnt, diesen Punkt setzt dein Sehen.  Ernst Mach zeigte um 1865, dass unsere Augen Kanten sogar dort verstärken, wo physikalisch gar keine scharfe Kante ist, die sogenannten Machschen Streifen.  Die Trennung ist echt in ihrer Wirkung und trotzdem nirgends im Ding selbst zu finden.`,
   aha:'Manche Grenzen liegen nicht in der Welt, sondern in dem, der hinsieht.' },

 { tag:'Das Unteilbare', mood:{glow:'#2c1a49', glyph:'Π', chord:[82.00,98.00,123.00]},
   frage:'Warum lässt sich eine Primzahl nicht in kleinere Faktoren zerlegen?',
   wahl:[{text:'Sie ist einfach zu klein zum Teilen.',tief:false},{text:'Zufall, manche Zahlen sind eben stur.',tief:false},{text:'Weil sie selbst ein Baustein ist, aus dem alle anderen Zahlen gebaut werden.',tief:true}],
   antwort_flach:'Verständlich gedacht, doch an der Größe liegt es nicht, denn auch riesige Primzahlen gibt es ohne Ende. Schau eine Schicht tiefer.',
   antwort_tief:'Ja. Sie ist kein Ergebnis, sie ist ein Anfang.',
   enthuellung:`Jede ganze Zahl lässt sich auf genau eine Weise in Primzahlen zerlegen, das ist der Fundamentalsatz der Arithmetik. Die Primzahlen sind die Atome des Multiplizierens, und Euklid zeigte schon vor mehr als zweitausend Jahren, dass es unendlich viele von ihnen gibt. Eine Primzahl lässt sich nicht zerlegen, weil sie die Schicht darunter selber ist, der Stoff, aus dem alle anderen Zahlen bestehen.`,
   aha:'Das Unteilbare ist nicht das Kleinste, sondern der Baustein.' },

 { tag:'Was Heimweh sucht', mood:{glow:'#16302c', glyph:'⌂', chord:[98.00,116.54,146.83]},
   frage:'Heimweh.  Sehnst du dich nach einem Ort?',
   wahl:[{text:'Nach dem Haus, den Räumen, der Straße.',tief:false},{text:'Nach der Zeit, die dort vergangen ist.',tief:false},{text:'Nach den Menschen, die dort waren.',tief:false},{text:'Nach einem Ich, das nur an diesem Ort ganz zu Hause war.',tief:true}],
   antwort_flach:'Der Ort ruft, seine Bilder sind warm und nah, und doch reist etwas mit, das kein Koffer fasst.',
   antwort_tief:'Ja. Kein Umzug bringt es zurück, denn es ist kein Ort.',
   enthuellung:`Der Arzt Johannes Hofer prägte 1688 dafür das Wort Nostalgie, aus dem Griechischen nostos, die Heimkehr, und algos, der Schmerz. Er beschrieb damit Schweizer Söldner, die sich krank sehnten nach zu Hause. Doch fahr wirklich an den alten Ort, und oft bleibt das Heimweh, weil es nie dem Pflaster galt. Unter der Sehnsucht nach dem Raum liegt eine Schicht tiefer die Sehnsucht nach einem Zustand, geborgen, gehalten, ganz. Heimweh ist ein Gefühl, das sich einen Ort sucht, um sich erklären zu können, gemeint aber ist ein Ich, das dort einmal zu Hause war.`,
   aha:'Heimweh zeigt auf einen Ort und meint eine Schicht tiefer ein Zuhause in dir.' },

 { tag:'Das Original', mood:{glow:'#4a7d86', glyph:'⧉', chord:[116.54,174.61,233.08]},
   frage:'Du kopierst einen Zustand perfekt, Bit für Bit.  Welcher ist das Original?',
   wahl:[{text:'Der erste, den es gab.',tief:false},{text:'Beide, oder keiner, die Frage passt nicht.',tief:true}],
   antwort_flach:'„Der erste“ klingt richtig, aber woran erkennst du ihn noch?',
   antwort_tief:'Ja, „Original“ ist plötzlich keine Eigenschaft mehr, die im Ding steckt.',
   enthuellung:`Kopierst du eine Datei oder ein Foto, ist die Kopie Byte für Byte dieselbe, ihr Hash stimmt exakt überein. Öffnest du beide, kannst du nicht sehen, welche zuerst da war, denn die Festplatte speichert nirgends ein „ich war das Original“. Sind zwei Zustände Bit für Bit gleich, unterscheidet nichts IN ihnen das Original. „Original“ liegt dann nicht im Objekt, sondern in seiner Geschichte, im Vorher. Das ist das Schiff des Theseus, neu erzählt, und der Grund, warum Herkunft protokolliert werden muss, nicht abgelesen.`,
   aha:'Identität steckt nicht im Zustand selbst, sondern in seiner Geschichte.' },

 { tag:'Aus wenig wird Welt', mood:{glow:'#2f3a1a', glyph:'▦', chord:[98.00,116.50,146.80]},
   frage:'Ein paar simple Regeln, stur wiederholt.  Kann daraus eine ganze lebendige Welt entstehen?',
   wahl:[{text:'Nein, simple Regeln geben simple Ergebnisse.',tief:false},{text:'Nur wenn jemand die Welt zusätzlich entwirft.',tief:false},{text:'Ja, aus der Wiederholung allein wachsen ganze Muster.',tief:true}],
   antwort_flach:'Klingt logisch, wenig oben sollte wenig unten ergeben. Meist stimmt das auch.',
   antwort_tief:'Ja, aus stur wiederholten Regeln kann sich Lebendiges auffalten.',
   enthuellung:`In Conways Spiel des Lebens gibt es nur vier winzige Regeln über lebende und tote Felder. Trotzdem entstehen darin Gebilde, die wandern, sich vermehren, sogar rechnen können. Niemand hat sie einzeln entworfen, sie tauchen aus der bloßen Wiederholung auf. Diese Schicht nennt man Emergenz, so wachsen aus wenigen sturen Regeln ganze Welten, ohne dass jemand die Welt geplant hat.`,
   aha:'Aus wenigen sturen Regeln kann sich eine ganze Welt von selbst auffalten.' },

 { tag:'Die Schleife', mood:{glow:'#8a5cd0', glyph:'∞', chord:[110.00,164.81,246.94]},
   frage:'Ein Programm fragt sich selbst, „Existiere ich?“  Was entsteht?',
   wahl:[{text:'Ein Fehler.',tief:false},{text:'Eine Endlosschleife.',tief:false},{text:'Ein „Ich“.',tief:true}],
   antwort_flach:'Technisch nicht falsch, aber es steckt mehr drin.',
   antwort_tief:'Ja, da, wo etwas sich auf sich selbst zurückbiegt.',
   enthuellung:`In einem Rechner ist Selbstbezug zuerst nichts Geheimnisvolles. Eine Funktion darf sich selbst aufrufen, das nennt man Rekursion, und ein Quine ist ein Programm, das genau seinen eigenen Quelltext ausgibt. Etwas Neues geschieht erst, wenn ein System die Welt nicht nur verarbeitet, sondern ein Modell von sich selbst in dieses Modell hineinnimmt. Wo ein System sich so auf sich selbst richtet, entsteht eine „seltsame Schleife“ (Hofstadter), und genau dort, so die These, keimt ein „Ich“. Das Universum, das über sich selbst nachdenkt, ist die komplexeste Form derselben Bewegung, die ganz unten mit „ist oder ist-nicht“ begann.`,
   aha:'Ein „Ich“ entsteht dort, wo ein System sich selbst hinterfragt.' },

 { tag:'Die Form in der Form', mood:{glow:'#14382c', glyph:'❄', chord:[87.00,104.00,131.00]},
   frage:'Du zoomst immer tiefer in die zerklüftete Linie einer Küste hinein.  Was siehst du?',
   wahl:[{text:'Irgendwann wird die Linie glatt und einfach.',tief:false},{text:'Nur noch Rauschen ohne jede Ordnung.',tief:false},{text:'Wieder dieselbe zerklüftete Form, in jeder Schicht aufs Neue.',tief:true}],
   antwort_flach:'Ein natürlicher Gedanke, weil in der Schule am Ende meist alles glatt wird. Bei diesen Formen aber nicht.',
   antwort_tief:'Ja. Das Ganze steckt in jedem seiner Teile.',
   enthuellung:`Benoît Mandelbrot nannte solche Gebilde Fraktale, Formen, die sich in jeder Vergrößerung selbst enthalten. Eine Küste wird beim Hineinzoomen nicht glatter, sie zeigt in jeder Schicht wieder Buchten in Buchten. Deshalb hat eine Küstenlinie keine feste Länge, denn je tiefer du misst, desto mehr Zerklüftung findest du noch darunter.`,
   aha:'In einem Fraktal wohnt das Ganze in jedem seiner Teile.' },

 { tag:'Der Widerspruch', hardcore:true, mood:{glow:'#b0446a', glyph:'⊥', chord:[103.83,155.56,207.65]},
   frage:'Ein Satz sagt, „Dieser Satz ist falsch.“  Wahr oder falsch?',
   wahl:[{text:'Wahr.',tief:false},{text:'Falsch.',tief:false},{text:'Beides bricht, der Satz kippt in sich.',tief:true}],
   antwort_flach:'Probier es, sag „wahr“, dann ist er falsch, sag „falsch“, dann ist er wahr.',
   antwort_tief:'Ja, er dreht sich um sich selbst, kein Ausgang.',
   enthuellung:`Der Satz redet über sich selbst, und genau das lässt Wahr und Falsch zusammenbrechen. Kurt Gödel hat aus genau dieser Selbstbezüglichkeit bewiesen, dass jedes hinreichend starke System Sätze enthält, die wahr, aber innerhalb des Systems nicht beweisbar sind. Selbstbezug ist keine Spielerei, er ist eine Grenze der Logik selbst.`,
   aha:'Selbstbezug erzeugt Sätze, die wahr sein können, ohne beweisbar zu sein.' },

 { tag:'Nötig heißt nicht genug', mood:{glow:'#241a2f', glyph:'🔑', chord:[96,144,192]},
   frage:'Ohne Schlüssel kommst du nicht in die Wohnung.  Heißt das, mit Schlüssel kommst du sicher hinein?',
   wahl:[{text:'Ja, der Schlüssel ist der Schlüssel.',tief:false},{text:'Nein, der Schlüssel ist nötig, aber vielleicht klemmt die Tür oder es ist der falsche.',tief:true},{text:'Ja, wozu sonst ein Schlüssel.',tief:false}],
   antwort_flach:'Fast, aber schau eine Schicht tiefer, nötig und genug sind zwei verschiedene Dinge.',
   antwort_tief:'Ja, nötig heißt nur ohne geht es nicht, nicht damit klappt es sicher.',
   enthuellung:`In der Logik heißt das der Unterschied zwischen notwendiger und hinreichender Bedingung.  Nötig bedeutet, ohne die Sache geht es nie.  Hinreichend bedeutet, mit der Sache klappt es sicher.  Der Schlüssel ist nötig, aber nicht hinreichend, denn er könnte der falsche sein oder die Tür klemmt.  Diese Trennung gehört seit Aristoteles zum Kern der klassischen Logik, und viele Alltagsstreits entstehen, weil jemand nötig mit genug verwechselt.`,
   aha:'Nötig heißt, ohne geht es nicht.  Genug heißt, damit geht es immer.  Fast nie ist beides dasselbe.' },

 { tag:'Rückwärts wahr', mood:{glow:'#14202e', glyph:'⟸', chord:[110,165,220]},
   frage:'Regel im Haus, wenn es regnet, wird der Hof nass.  Heute ist der Hof trocken.  Was folgt mit Sicherheit?',
   wahl:[{text:'Vielleicht regnet es trotzdem irgendwo.',tief:false},{text:'Nichts Sicheres, Regen und Nässe haben nichts miteinander zu tun.',tief:false},{text:'Es regnet nicht, denn sonst wäre der Hof nass.',tief:true}],
   antwort_flach:'Schau eine Schicht tiefer, die Regel lässt sich sauber rückwärts lesen.',
   antwort_tief:'Ja, aus trocken folgt zwingend, es regnet nicht.',
   enthuellung:`Das ist die Kontraposition.  Aus wenn A dann B wird zwingend wenn nicht B dann nicht A, und beide Sätze sagen genau dasselbe.  Der Schluss heißt Modus tollens, die stoischen Logiker um Chrysippos beschrieben ihn schon vor über zweitausend Jahren.  Du darfst die Folge verneinen und rückwärts auf die Ursache schließen.  Was du nicht darfst, ist den Satz einfach umzudrehen.`,
   aha:'Jedes wenn A dann B trägt heimlich seinen Zwilling in sich, wenn nicht B dann nicht A.' },

 { tag:'Der falsche Rückschluss', mood:{glow:'#2a1a1a', glyph:'⇄', chord:[104,156,208]},
   frage:'Wenn jemand Fieber hat, ist die Stirn warm.  Deine Stirn ist warm.  Hast du Fieber?',
   wahl:[{text:'Ja, warme Stirn heißt Fieber.',tief:false},{text:'Nicht sicher, warm kann auch von der Sonne oder vom Sport kommen.',tief:true},{text:'Ja, das folgt doch aus der Regel.',tief:false}],
   antwort_flach:'Schau eine Schicht tiefer, die Regel gilt nur in eine Richtung.',
   antwort_tief:'Ja, aus der Wirkung darf man nicht einfach auf die Ursache zurückschließen.',
   enthuellung:`Das ist der Fehlschluss der Umkehrung, in der Logik auch Bejahung des Nachsatzes genannt.  Aus wenn A dann B folgt eben nicht wenn B dann A, denn die warme Stirn kann viele Ursachen haben, Sonne, Sport, ein heißes Bad.  Genau hier stolpert der Alltag am häufigsten.  Erlaubt ist nur die Kontraposition, wenn nicht B dann nicht A, verboten die simple Umkehr.  Schon Aristoteles trennte diese beiden Richtungen sauber.`,
   aha:'Aus einer wahren Regel wird eine falsche, sobald du Ursache und Wirkung einfach tauschst.' },

 { tag:'Der eine schwarze Schwan', mood:{glow:'#101a24', glyph:'🦢', chord:[92,138,184]},
   frage:'Jahrhundertelang galt in Europa, alle Schwäne sind weiß.  Wie viele Vögel braucht es, um diesen Satz umzuwerfen?',
   wahl:[{text:'Sehr viele, ein halber Kontinent voll.',tief:false},{text:'So einen alten Satz kann man nie ganz umwerfen.',tief:false},{text:'Ein einziger schwarzer genügt.',tief:true}],
   antwort_flach:'Schau eine Schicht tiefer, ein alle bricht überraschend leicht.',
   antwort_tief:'Ja, ein einziger Gegenfall stürzt jedes alle.',
   enthuellung:`1697 sah der Holländer Willem de Vlamingh in Australien schwarze Schwäne, und der alte Satz alle Schwäne sind weiß war mit einem Schlag tot.  Ein Allsatz braucht keine Mehrheit gegen sich, ein einziges Gegenbeispiel reicht.  Karl Popper machte daraus sein Herzstück, kein noch so langes Beobachten beweist ein alle endgültig, aber ein einziger Fall kann es widerlegen.  Bestätigungen sammeln ist schwach, ein sauberes Gegenbeispiel ist mächtig.`,
   aha:'Ein alle ist ein Riese auf einem Bein, ein einziger Gegenfall bringt ihn zu Fall.' },

 { tag:'Das leere Versprechen', hardcore:true, mood:{glow:'#1c1420', glyph:'∅', chord:[87,131,174]},
   frage:'Ich sage, wenn ich heute fliege, schenke ich dir mein Haus.  Ich fliege nicht.  Habe ich gelogen?',
   wahl:[{text:'Ja, du hast mir kein Haus geschenkt.',tief:false},{text:'Nein, das Versprechen bleibt wahr, weil die Bedingung nie eintrat.',tief:true},{text:'Nur halb, du drückst dich davor.',tief:false}],
   antwort_flach:'Schau eine Schicht tiefer, gebrochen ist ein Versprechen erst, wenn die Bedingung eintritt und du nicht lieferst.',
   antwort_tief:'Genau, ohne Flug gibt es keinen Bruch, also bleibt der Satz wahr.',
   enthuellung:`In der klassischen Logik ist ein wenn dann Satz immer wahr, solange die Voraussetzung falsch ist, das nennt man leere Wahrheit.  Erst ein wahres Wenn mit einem falschen Dann macht ihn falsch.  Daraus folgt der verblüffende Satz, alle Elemente der leeren Menge sind grün, und er stimmt, weil es keinen einzigen Gegenfall gibt.  Frege und Russell gossen diese materiale Implikation um 1900 in feste Form.  Dass man das Wenn dann genau so definiert, ist eine kluge Konvention, kein Naturgesetz, und das darf man ehrlich dazusagen.`,
   aha:'Ein Versprechen, dessen Bedingung nie eintritt, kannst du nie brechen, also bleibt es wahr.' },

 { tag:'Was Symmetrie wirklich ist', mood:{glow:'#1b3050', glyph:'◑', chord:[98.00,123.00,165.00]},
   frage:'Was heißt es im Kern, dass etwas symmetrisch ist?',
   wahl:[{text:'Dass die linke und die rechte Hälfte gleich aussehen.',tief:false},{text:'Dass es besonders schön und geordnet wirkt.',tief:false},{text:'Dass sich etwas verändert, und trotzdem dasselbe bleibt.',tief:true}],
   antwort_flach:'Das ist das vertraute Bild vom Spiegel, und es stimmt für viele Dinge. Doch eine weitere Schicht liegt noch darunter.',
   antwort_tief:'Genau. Symmetrie ist Veränderung, die nichts verändert.',
   enthuellung:`Drehst du einen Kreis um seinen Mittelpunkt, sieht er danach genau gleich aus, die Bewegung lässt ihn unverändert, das nennt man Invarianz. Die Mathematikerin Emmy Noether entdeckte, dass hinter jeder solchen Symmetrie ein Erhaltungssatz steckt, aus der Gleichheit der Zeit folgt sogar die Erhaltung der Energie. Unter dem schönen Aussehen liegt also eine tiefere Schicht, in der Symmetrie sagt, was sich ändern darf, ohne dass das Wesentliche sich ändert.`,
   aha:'Symmetrie ist das, was gleich bleibt, wenn du etwas veränderst.' },

 { tag:'Das Unentscheidbare', hardcore:true, mood:{glow:'#c79030', glyph:'?', chord:[98.00,130.81,196.00]},
   frage:'Kann ein Programm für jedes andere sicher sagen, ob es je anhält?',
   wahl:[{text:'Ja, mit genug Rechenpower.',tief:false},{text:'Nein, das ist grundsätzlich unmöglich.',tief:true}],
   antwort_flach:'Rechenpower hilft nicht, das Problem ist tiefer als Geschwindigkeit.',
   antwort_tief:'Ja, und das ist bewiesen, nicht nur unbekannt.',
   enthuellung:`Alan Turing hat 1936 bewiesen, dass es kein Programm geben kann, das für jedes andere entscheidet, ob es anhält oder ewig läuft. Nicht „noch nicht“, sondern prinzipiell nie. Es gibt Fragen, die keine Maschine beantworten kann, und das zu wissen ist selbst eine tiefe Antwort.`,
   aha:'Manche Fragen sind nicht schwer, sie sind prinzipiell unentscheidbar.' },

 { tag:'Zeit', mood:{glow:'#4457c0', glyph:'→', chord:[87.31,130.81,174.61]},
   frage:'Zeit, fließt sie wie ein Strom?  Oder ist sie etwas anderes?',
   wahl:[{text:'Sie fließt.',tief:false},{text:'Sie ist die Reihenfolge der Zustände.',tief:true}],
   antwort_flach:'So fühlt es sich an, aber das Gefühl ist nicht die Sache.',
   antwort_tief:'Ja, kein Fluss, eine Ordnung.',
   enthuellung:`Denk sie als Reihenfolge statt als Substanz. Sieh dir eine Uhr an, sie misst keinen fließenden Stoff, sie zählt nur Wiederholungen, das Pendel schwingt, der Quarz zittert vieltausendmal in der Sekunde, ein Tick immer nach dem vorigen. Vergangenheit heißt dann nicht früher, sondern eine tiefere Schicht, jeder Zustand baut auf dem vorigen, und die Zeit ist der Zähler dieser Schichten. Sogar ernsthafte Physik baut Raumzeit genau so, aus reiner Ordnung, die Causal Sets, wo Ordnung und Zahl die Geometrie ergeben.`,
   aha:'Zeit ist vielleicht kein Fluss, sondern die Reihenfolge der Schichten.' },

 { tag:'Das Tempo der Dinge', mood:{glow:'#5566cc', glyph:'γ', chord:[130.81,196.00,261.63]},
   frage:'Licht ist das Schnellste im ganzen Universum.  Warum ausgerechnet Licht?',
   wahl:[{text:'Zufall, es ist eben sehr schnell.',tief:false},{text:'Weil ihm nichts im Weg steht.',tief:false},{text:'Weil es so winzig und klein ist.',tief:false},{text:'Weil es keine Masse hat, nichts, was es bremst.',tief:true}],
   antwort_flach:'Es fühlt sich nach purem Tempo an, aber der Grund liegt eine Schicht tiefer.',
   antwort_tief:'Genau. Kein Gewicht, keine Bremse, also das höchste Tempo, das es gibt.',
   enthuellung:`Ein Lichtteilchen hat keine Masse und keine innere Struktur, die es mitschleppen müsste, deshalb reist es mit dem absoluten Tempolimit des Universums, der Lichtgeschwindigkeit. Alles, was Masse trägt, ist langsamer, und je mehr Masse und Struktur ein Ding trägt, desto träger wird es durch den Raum. Der tiefere Gedanke stammt von Einstein, alles bewegt sich mit ein und demselben Tempo durch die Raumzeit. Was du an Tempo in den Raum steckst, fehlt dir in der Zeit. Das Licht steckt alles in den Raum, für ein Photon vergeht deshalb überhaupt keine Zeit.`,
   aha:'Je leichter und einfacher, desto näher am Licht, je mehr Masse, desto langsamer durch den Raum.' },

 { tag:'Das erste Tempo', mood:{glow:'#5a2f7a', glyph:'✷', chord:[65.41,98.00,146.83]},
   frage:'Und ganz am Anfang, war doch einmal etwas schneller als das Licht?',
   wahl:[{text:'Nein, nichts war je schneller als Licht.',tief:false},{text:'Ja, ein Teilchen, das wir noch nicht kennen.',tief:false},{text:'Ja, aber nur ganz kurz und aus Versehen.',tief:false},{text:'Ja, der Raum selbst, im allerersten Augenblick.',tief:true}],
   antwort_flach:'Fast eine Fangfrage, denn die Regel gilt und gilt doch nicht. Schau genauer.',
   antwort_tief:'Ja. Nicht ein Ding im Raum, sondern der Raum selber.',
   enthuellung:`Nichts kann sich schneller als Licht durch den Raum bewegen. Aber der Raum selbst darf sich schneller dehnen, denn das ist keine Bewegung durch den Raum, es ist der Raum, der wächst. Im ersten winzigen Sekundenbruchteil tat er genau das, die kosmische Inflation, und blies einen einzigen Punkt in unvorstellbar kurzer Zeit um mehr als das Billiardenfache auf. Es geschah überall zugleich, der Anfang war in gewissem Sinn überall und nirgends. Und was ihn auslöste, der Zustand vor dem ersten Augenblick, dort endet unser Wissen und beginnt die Vermutung.`,
   aha:'Nichts reist schneller als Licht durch den Raum, aber der Raum selbst kann sich schneller dehnen.' },

 { tag:'Das Dazwischen', mood:{glow:'#2a54a8', glyph:'0∙1', chord:[73.42,110.00,146.83]},
   frage:'Was liegt zwischen der 0 und der 1?',
   wahl:[{text:'Nichts, sie liegen nebeneinander.',tief:false},{text:'Ein paar Zahlen, 0.5 und so.',tief:false},{text:'Unendlich viele, ohne Ende.',tief:true}],
   antwort_flach:'Mehr, als du denkst, schau genauer in den Spalt.',
   antwort_tief:'Ja, ein Abgrund voller Zahlen.',
   enthuellung:`Zwischen 0 und 1 liegen unendlich viele Zahlen, und zwar so unendlich viele, dass man sie nicht einmal durchnummerieren kann (Cantor, „überabzählbar“). Der kleinste Spalt enthält ein ganzes Kontinuum. Nahe null ist nie leer, es ist am dichtesten bevölkert.`,
   aha:'Der kleinste Abstand kann eine ganze Unendlichkeit enthalten.' },

 { tag:'Warum Mathe passt', mood:{glow:'#123f3a', glyph:'φ', chord:[98.00,117.00,147.00]},
   frage:'Zahlen hast du im Kopf erfunden.  Warum beschreiben sie dann Sterne und Atome so unheimlich genau?',
   wahl:[{text:'Zufall, wir merken uns nur die Treffer und vergessen den Rest.',tief:false},{text:'Weil wir die Welt so lange biegen, bis die Zahlen passen.',tief:false},{text:'Weil die Zahlen ein Muster treffen, das tiefer liegt als die Dinge.',tief:true},{text:'Weil Menschen eben klug rechnen können.',tief:false}],
   antwort_flach:'Ein ehrlicher Gedanke, und ein Stück weit stimmt er sogar. Doch das Staunen darunter bleibt bestehen.',
   antwort_tief:'Genau. Die Zahl trifft nicht das Ding, sondern das Muster darunter.',
   enthuellung:`Der Physiker Eugene Wigner nannte es die unbegreifliche Wirksamkeit der Mathematik, unreasonable effectiveness. Ein Beispiel: 1846 rechnete Urbain Le Verrier aus winzigen Stoerungen in der Bahn des Uranus, dass dort ein weiterer, unbekannter Planet stehen muesse, und gab seinen Ort am Himmel an. Noch in derselben Nacht richteten Astronomen ihr Fernrohr dorthin und fanden Neptun, fast genau an der berechneten Stelle. Eine Formel, rein aus Gedanken geboren, hatte einen Himmelskoerper vorausgesagt, den noch niemand gesehen hatte. Als lebte unter der sichtbaren Welt eine Schicht aus reinen Mustern, und Mathematik ist die Sprache, in der diese Schicht zu uns spricht.`,
   aha:'Mathematik beschreibt nicht die Dinge, sondern das Muster, das tiefer liegt.' },
