name: Check learning paths
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
  eltern-browser:
    name: Parents progress import in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/lernstudio-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/lernstudio-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check local import, keyboard and responsive themes
        env:
          HALVETH_PLAYWRIGHT: ${{ runner.temp }}/lernstudio-browser/node_modules/playwright
          HALVETH_TEST_OUTPUT: ${{ runner.temp }}/lernstudio-browser-results
        run: node tests/elternmodus.browser.cjs
      - name: Preserve browser receipt and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lernstudio-eltern-browser
          path: ${{ runner.temp }}/lernstudio-browser-results/
          if-no-files-found: warn
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HARDHAT_DISABLE_TELEMETRY: "true"
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:tooling
      - run: npm test
      - run: npm run test:receipt
      - run: npm run verify:receipt
